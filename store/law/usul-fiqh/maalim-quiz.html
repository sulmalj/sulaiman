<title>بنك أسئلة أصول الفقه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* تخطيط: شاشة واحدة بعرض الجوال؛ الرئيسية قائمة أقسام بتقدّمها، وشاشة السؤال بطاقة واحدة وتصحيح فوري تحتها */
:root{
  --paper:#f7f8f6; --surface:#ffffff; --ink:#1d2622; --muted:#5b6862; --line:#d9dfdb;
  --green:#14594a; --green-soft:#e3efeb; --red:#a3271f; --red-soft:#fbeceb; --gold:#8a6a12; --gold-soft:#f6efd9;
  --display:"Amiri","Traditional Arabic",serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121816; --surface:#1a2220; --ink:#e4ebe8; --muted:#9aa8a2; --line:#2e3a36;
  --green:#6cc2a9; --green-soft:#1d3530; --red:#f08a80; --red-soft:#3a1f1d; --gold:#e0c06a; --gold-soft:#332c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --surface:#1a2220; --ink:#e4ebe8; --muted:#9aa8a2; --line:#2e3a36;
  --green:#6cc2a9; --green-soft:#1d3530; --red:#f08a80; --red-soft:#3a1f1d; --gold:#e0c06a; --gold-soft:#332c18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.8;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:680px;margin:0 auto}
header{padding-block:24px 8px}
h1{font-family:var(--display);font-size:2rem;line-height:1.3;margin:0;color:var(--green);text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.93rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:1.35rem;color:var(--green);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.actions{display:grid;gap:8px;margin:8px 0 20px}
button{font:inherit;cursor:pointer;border-radius:6px}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn{background:var(--green);color:var(--paper);border:0;padding:12px 16px;font-weight:700;font-size:1rem}
.btn.alt{background:var(--surface);color:var(--green);border:1px solid var(--green)}
.btn.warn{background:var(--surface);color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.45;cursor:default}
h2{font-size:1rem;color:var(--muted);margin:22px 0 8px;font-weight:500}
.secs{display:grid;gap:8px}
.sec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);padding:12px 14px;color:var(--ink);width:100%}
.sec .t{font-weight:700}
.sec .p{font-size:.8rem;color:var(--muted)}
.sec .n{grid-row:span 2;font-size:.85rem;color:var(--green);font-variant-numeric:tabular-nums;text-align:center}
.bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.tag{display:inline-block;font-size:.72rem;background:var(--gold-soft);color:var(--gold);padding:0 8px;border-radius:999px;margin-inline-start:6px;font-weight:500}
.note{background:var(--gold-soft);border-radius:6px;padding:10px 14px;font-size:.92rem;margin:12px 0}
/* شاشة السؤال */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:16px 8px}
.back{background:none;border:0;color:var(--green);padding:6px 0;font-weight:500}
.count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--green);transition:width .2s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.kind{font-size:.78rem;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.past{font-size:.76rem;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:1px 10px;border-radius:999px;white-space:nowrap}
.q{font-size:1.12rem;font-weight:500;line-height:1.9;margin:0 0 14px}
.opts{display:grid;gap:8px}
.tf{grid-template-columns:1fr 1fr}
.opt{background:var(--paper);border:1.5px solid var(--line);color:var(--ink);padding:11px 14px;text-align:start;font-size:1rem;line-height:1.6}
.tf .opt{text-align:center;font-weight:700}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:6px;padding:12px 14px;font-size:.98rem}
.fb.ok{background:var(--green-soft)}
.fb.no{background:var(--red-soft)}
.fb .h{font-weight:700;display:block;margin-bottom:2px}
.fb.ok .h{color:var(--green)} .fb.no .h{color:var(--red)}
.fb .c{display:block;margin-top:6px;font-weight:500}
.fb .c b{color:var(--green)}
.nav{display:flex;gap:8px;margin-top:14px}
.nav .btn{flex:1}
.end{text-align:center;padding:24px 8px}
.end .big{font-size:2.6rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.2}
.end p{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<script>
// T = عبارة صحيحة، F = عبارة خاطئة (مع التصحيح)، M = اختيار من متعدد (أول خيار هو الصحيح، والخيارات تنخلط عند العرض)
const S=[
 {k:'t',name:'التمهيد',pages:'ص13–30',mid:1},
 {k:'h',name:'الحاكم والحكم الشرعي',pages:'ص37–42',mid:1},
 {k:'w',name:'الواجب وتقسيماته',pages:'ص45–63',mid:1},
 {k:'n',name:'المندوب والحرام والمكروه والمباح',pages:'ص65–79',mid:1},
 {k:'v',name:'الحكم الوضعي',pages:'ص84–96',mid:1},
 {k:'a',name:'المحكوم عليه (الأهلية والعوارض)',pages:'ص101–112',mid:1},
 {k:'f',name:'المحكوم فيه ومصادر التشريع',pages:'ص113–124',mid:1}
];
const Q=[];
const T=(s,q,e)=>Q.push({s,q,t:'tf',a:true,e});
const F=(s,q,c,e)=>Q.push({s,q,t:'tf',a:false,c,e});
const M=(s,q,o,e)=>Q.push({s,q,t:'mc',o,e});

/* ===== التمهيد ===== */
T('t','«أصول» جمع أصل، ومعناه في اللغة: أساس الشيء، أو ما يُبنى عليه غيره.','ص13.');
F('t','أقرب معاني «الأصل» اصطلاحاً لموضوع أصول الفقه: القاعدة المستمرة.','الأقرب لموضوعنا أن «الأصل» بمعنى الدليل، فأصول الفقه = أدلة الفقه.','ص13.');
F('t','الأدلة الإجمالية تُدرس في علم الفقه، والتفصيلية في أصول الفقه.','الإجمالية تُدرس في أصول الفقه، والتفصيلية يختص بها علم الفقه والخلاف.','ص13.');
T('t','الفقه في اللغة: العلم، وقيل: الفهم.','ص14.');
F('t','الفقه اصطلاحاً: العلم بالأحكام الشرعية العملية المكتسبة من أدلتها الإجمالية.','الفقه: العلم بالأحكام الشرعية العملية المكتسبة من أدلتها التفصيلية.','ص14.');
T('t','أصول الفقه (لقباً): العلم بالقواعد الكلية التي يُتوصل بها إلى استنباط الأحكام الشرعية العملية من أدلتها التفصيلية.','ص14.');
F('t','«القاعدة» في تعريف أصول الفقه: قضية جزئية تختص بفرد واحد.','القاعدة قضية كلية يدخل تحتها جزئيات كثيرة، مثل «الأمر للوجوب».','ص14.');
T('t','قاعدة «النهي يفيد التحريم» مثال لما يتوصل به المجتهد إلى استنباط الأحكام.','ص15: «فإنه يُتوصل بها إلى بيان حكم الله… بأنه حرام».');
T('t','قيد «الشرعية» في التعريف يُخرج الأحكام العقلية واللغوية والحسية.','ص15.');
T('t','قيد «العملية» يشمل عمل القلب كوجوب النية، وعمل اللسان، وعمل الجوارح.','ص15.');
F('t','علم أصول الفقه يعتني بالأدلة التفصيلية، بينما يبحث علم الفقه بالأدلة الإجمالية.','العكس: أصول الفقه يعتني بالأدلة الإجمالية، والفقه يبحث بالأدلة التفصيلية.','ص17.');
T('t','علم أصول الفقه بالنسبة للفقه كعلم النحو بالنسبة للنطق والكتابة العربية.','ص17: هو ميزان يضبط الفقيه ويمنعه من الخطأ في الاستنباط.');
T('t','علم أصول الفقه بمثابة الآلة التي يستطيع بها الفقيه استنباط الحكم الشرعي من الدليل التفصيلي.','ص17.');
F('t','غاية عالم الأصول: الوصول إلى الحكم الجزئي من خلال البحث في الأدلة التفصيلية.','غاية عالم الأصول وضع قواعد كلية لمعرفة كيفية الاستنباط. أما الوصول للحكم الجزئي فغاية الفقيه.','ص17–18.');
T('t','ميدان عالم الأصول: الأدلة الكلية كالكتاب والسنة.','ص17.');
T('t','تشترك القاعدة الأصولية والفقهية في أن كلاً منهما قضية كلية متعلقة بالفقه يدخل تحتها فروع كثيرة.','ص19.');
F('t','القاعدة الفقهية تُستخرج منها أحكام الجزئيات بواسطة الدليل.','الأصولية هي اللي تستخرج منها الأحكام بواسطة الدليل، أما الفقهية فمباشرة بدون توسط الدليل.','ص19.');
T('t','قاعدة «اليقين لا يزول بالشك» قاعدة فقهية يُعمل بها مباشرة بدون توسط الدليل.','ص19.');
T('t','القاعدة الأصولية وسيلة، والقاعدة الفقهية ضابط كلي للأحكام التي توصل إليها المجتهد.','ص20: القواعد الفقهية ضوابط للثمرة المتحققة من أصول الفقه.');
F('t','القاعدة الفقهية متقدمة في وجودها على القاعدة الأصولية.','القاعدة الأصولية هي المتقدمة في وجودها على القواعد الفقهية.','ص20.');
T('t','يستمد علم أصول الفقه مادته من: أصول الدين، واللغة العربية، والأحكام الشرعية.','ص20–21.');
T('t','أصول الدين يعبّر عنه أكثر العلماء بـ«علم الكلام».','ص20.');
T('t','تعلّم أصول الفقه فرض كفاية على الأمة، وفرض عين على المجتهد.','ص22.');
F('t','تعلّم أصول الفقه فرض عين على جميع الأمة.','فرض كفاية على الأمة، وفرض عين على المجتهد فقط.','ص22.');
T('t','من فوائد أصول الفقه: حماية الفقيه من التناقض.','ص23: لأن فتاواه تكون مبنية على مآخذ وقواعد.');
F('t','يمكن لأي شخص تفسير النصوص الشرعية والقانونية وشرحها ولو لم يكن عالماً بأصول الفقه.','لا يمكن لأي شخص القيام بتفسير النصوص الشرعية والقانونية إلا إذا كان عالماً بأصول الفقه.','ص23.');
T('t','من فوائد أصول الفقه: مواجهة خصوم الشريعة الذين يزعمون أن الإسلام لم يعد صالحاً للتطبيق.','ص23.');
F('t','تشكّل علم أصول الفقه علماً مستقلاً في عصر الصحابة رضي الله عنهم.','كانت القواعد متناثرة ولم تتشكل علماً مستقلاً إلى أن جاء الشافعي في القرن الثاني.','ص24–25.');
T('t','الشافعي أول من صنّف كتاباً في علم أصول الفقه.','ص25: كتاب «الرسالة».');
T('t','«الرسالة» اسم للكتاب الذي ألفه الشافعي في علم أصول الفقه.','ص25.');
T('t','زاد التابعون على منهج الصحابة الأخذ بفتاوى الصحابة واجتهاداتهم.','ص24.');
T('t','العلماء بعد الشافعي وافقوه في أكثر مسائله، وخالفوه في بعضها، وزادوا عليه.','ص25.');
T('t','طريقة المتكلمين من طرق التأليف في علم أصول الفقه.','ص26.');
T('t','طريقة المتكلمين تسمى أيضاً طريقة الشافعية، وطريقة الجمهور.','ص26 وص30.');
F('t','طريقة المتكلمين تسمى طريقة الحنفية.','طريقة الحنفية هي طريقة الفقهاء. المتكلمين = الشافعية = الجمهور.','ص26.');
F('t','طريقة الفقهاء تمتاز بتجريد المسائل الأصولية عن الفروع الفقهية.','التجريد عن الفروع من مميزات طريقة المتكلمين. طريقة الفقهاء تأخذ القواعد من الفروع.','ص26–27.');
T('t','طريقة المتكلمين أبعد عن التعصب لفرع فقهي أو حكم مذهبي.','ص26.');
T('t','سبب لجوء الحنفية لطريقتهم أنهم لم يعثروا على كتب في الأصول من وضع أئمتهم.','ص27.');
T('t','طريقة الفقهاء أقرب إلى الفقه وأليق بالفروع، وسميت بذلك لكثرة الفروع الفقهية فيها.','ص27.');
T('t','طريقة المتأخرين تجمع بين طريقتي المتكلمين والفقهاء.','ص27.');
M('t','أول كتاب صُنّف في علم أصول الفقه:',['الرسالة للشافعي','روضة الناظر لابن قدامة','البرهان للجويني','أصول السرخسي'],'ص25.');
M('t','من كتب طريقة المتكلمين (الشافعية):',['روضة الناظر لابن قدامة','تقويم الأدلة للدبوسي','أصول السرخسي','ميزان الأصول للسمرقندي'],'ص26–27. الثلاثة الباقية من كتب الحنفية.');
M('t','من كتب طريقة الفقهاء (الحنفية):',['الفصول في الأصول للجصاص','اللمع للشيرازي','الورقات للجويني','جمع الجوامع لابن السبكي'],'ص27.');
M('t','من كتب طريقة المتأخرين:',['جمع الجوامع لتاج الدين ابن السبكي','التمهيد لأبي الخطاب','شرح تنقيح الفصول للقرافي','تقويم الأدلة للدبوسي'],'ص27: وبديع النظام لابن الساعاتي، والتحرير لابن الهمام.');
M('t','الطريقة التي تمتاز بالميل الشديد إلى الاستدلال العقلي والبسط في الجدل والمناظرات:',['طريقة المتكلمين','طريقة الفقهاء','طريقة المتأخرين'],'ص26.');
M('t','الطريقة التي تأخذ القواعد الأصولية من الفروع والأحكام التي وضعها أئمة المذهب:',['طريقة الفقهاء (الحنفية)','طريقة المتكلمين (الشافعية)','طريقة المتأخرين'],'ص27.');
M('t','الأقرب لمعنى «الأصل» اصطلاحاً في علم أصول الفقه:',['الدليل','القاعدة المستمرة','الراجح','المقيس عليه'],'ص13.');
M('t','ميدان الفقيه:',['الأدلة التفصيلية الجزئية الخاصة','الأدلة الكلية كالكتاب والسنة','القواعد الكلية','علم الكلام'],'ص18.');
M('t','حكم تعلّم أصول الفقه بالنسبة للأمة:',['فرض كفاية','فرض عين','مستحب','مباح'],'ص22.');
M('t','حكم تعلّم أصول الفقه بالنسبة للمجتهد:',['فرض عين','فرض كفاية','مستحب','مباح'],'ص22: لا يمكن أن يصل إلى درجة الاجتهاد إلا بتعلمه.');
M('t','القاعدة الأصولية متعلقة بكيفية العمل:',['مع الواسطة','بلا واسطة','بالقياس فقط','بالعرف'],'ص19.');
M('t','ظهر علم أصول الفقه علماً مستقلاً في:',['القرن الثاني','القرن الأول','القرن الرابع','القرن السادس'],'ص25: الشافعي في القرن الثاني.');

/* ===== الحاكم والحكم ===== */
T('h','الحاكم هو الله وحده.','ص37: الحاكم هو الله تعالى.');
F('h','العقل حاكم يستطيع إنشاء الأحكام الشرعية.','العقل ليس بحاكم، وإنما هو آلة الإدراك والتمييز.','ص37.');
F('h','العقل ليس مصدراً للتشريع، فهو لا يستطيع التمييز بين الحسن والقبيح أبداً.','العقل ليس حاكماً، لكنه إذا صفا يستطيع أن يميز بعض التمييز بين الحسن والقبيح.','ص37.');
T('h','العقل ليس مصدراً للتشريع.','ص37: العقل ليس بحاكم.');
F('h','الثواب والعقاب الأخروي يُعلمان بالعقل.','الثواب والعقاب الأخروي إنما يُعلمان بالوحي، عن طريق الرسل.','ص38.');
F('h','الرسول ﷺ مشرّع للأحكام.','الرسول ﷺ ليس بحاكم ولا مشرّع، وإنما هو مبلّغ وناقل ومبيّن للتشريع.','ص38.');
T('h','الحكم الشرعي: خطاب الله المتعلق بأفعال المكلفين بالاقتضاء أو التخيير أو الوضع.','ص39.');
F('h','الخطاب الموجّه إلى غير المكلفين، كالوحي إلى النحل، يعتبر حكماً شرعياً.','لا يعتبر حكماً لعدم تعلقه بفعل المكلف.','ص39.');
T('h','أفعال المكلفين تشمل الأعمال القلبية وأعمال الجوارح.','ص40.');
F('h','أفعال المكلفين تشمل الإقدام على الفعل فقط، ولا تشمل الكف عنه.','تشمل الإقدام على الفعل والكف عنه، فيدخل إيجاب الصوم وهو كف.','ص40.');
T('h','المراد بالاقتضاء في تعريف الحكم الشرعي: الطلب، سواء أكان طلب فعل أم طلب ترك.','ص40.');
F('h','طلب الفعل طلباً جازماً يسمى ندباً.','طلب الفعل طلباً جازماً يسمى إيجاباً، وغير الجازم ندباً.','ص40.');
T('h','طلب الترك طلباً غير جازم يسمى كراهة.','ص40: والجازم يسمى تحريماً.');
T('h','قيد «التخيير» في تعريف الحكم الشرعي لإدخال الإباحة.','ص40.');
F('h','الإباحة حكم عقلي سابق للأحكام الشرعية، وليست حكماً شرعياً.','هذا قول من أسقط قيد التخيير، والكتاب يقول: هذا خطأ، فالإباحة حكم شرعي.','ص40.');
T('h','المراد بالوضع: جعل الشيء سبباً أو شرطاً أو مانعاً، أو وصفه بالصحة أو الفساد.','ص41.');
T('h','الحكم الشرعي التكليفي: ما طُلب به فعل أو كف أو خُيّر بينهما.','ص41.');
T('h','سُمّي الحكم التكليفي بذلك لأن أداء الفعل أو الكف عنه يقتضي كلفة ومشقة.','ص41.');
F('h','الواجب من أقسام الحكم الوضعي.','الواجب من أقسام الحكم التكليفي.','ص42.');
F('h','المباح من الحكم الوضعي.','المباح من أقسام الحكم التكليفي.','ص42.');
F('h','الصحة من أقسام الحكم التكليفي.','الصحة من أقسام الحكم الوضعي.','ص42.');
F('h','الحكم التكليفي هو الحكم الوضعي.','الحكم الشرعي نوعان مختلفان: تكليفي ووضعي.','ص42.');
T('h','الحكم التكليفي غير الحكم الوضعي.','ص42.');
T('h','الحكم التكليفي يتضمن خمسة أحكام: الواجب، والمندوب، والحرام، والمكروه، والمباح.','ص42.');
T('h','الحكم الوضعي يتضمن خمسة أحكام: السبب، والشرط، والمانع، والصحيح، والفاسد.','ص42.');
T('h','سميت الأحكام الوضعية بذلك لأنها موضوعة من الله علامة للأحكام التكليفية.','ص42.');
M('h','الحاكم عند الأصوليين:',['الله تعالى','الرسول ﷺ','العقل','المجتهد'],'ص37.');
M('h','وظيفة الرسول ﷺ بالنسبة للأحكام:',['مبلّغ ومبيّن','مشرّع','حاكم','مجتهد فقط'],'ص38.');
M('h','«بزوال الشمس تجب الظهر» مثال للحكم:',['الوضعي','التكليفي','المباح','المكروه'],'ص41: جعل زوال الشمس علامة لوجوب الظهر.');
M('h','«المحرمية مانعة من صحة الزواج» مثال للحكم:',['الوضعي','التكليفي'],'ص41.');
M('h','«الالتفات في الصلاة مكروه» مثال للحكم:',['التكليفي','الوضعي'],'ص41.');
M('h','«البيع بثمن مجهول فاسد» مثال للحكم:',['الوضعي','التكليفي'],'ص41.');
M('h','طلب الترك طلباً جازماً يسمى:',['تحريماً','كراهة','إيجاباً','ندباً'],'ص40.');
M('h','القيد الذي أُدخل به المباح في تعريف الحكم الشرعي:',['التخيير','الاقتضاء','الوضع','أفعال المكلفين'],'ص40.');

/* ===== الواجب ===== */
T('w','الواجب في اللغة له معنيان: اللازم والثابت، والساقط.','ص45.');
F('w','الواجب اصطلاحاً: ما طلب الشارع فعله طلباً غير جازم.','الواجب: ما طلب الشارع فعله طلباً جازماً. وغير الجازم هو المندوب.','ص46.');
T('w','صيغ الأمر ثلاث: فعل الأمر، والمضارع المقترن بلام الأمر، واسم فعل الأمر.','ص46.');
F('w','اسم فعل الأمر ليس من صيغ الوجوب.','اسم فعل الأمر من صيغ الأمر الدالة على الوجوب، مثل «عليكم أنفسكم» أي الزموا.','ص46.');
T('w','لفظ «فرض» وما اشتق منه من الألفاظ الموضوعة للإيجاب والإلزام.','ص46.');
T('w','لفظ «كتب» وما اشتق منه من صيغ الوجوب.','ص47.');
T('w','الوعيد على الترك من صيغ الوجوب، سواء كانت العقوبة في الدنيا أو الآخرة.','ص47.');
T('w','الواجب المطلق: ما طلب الشارع فعله دون أن يقيد أداءه بوقت معين.','ص47. ومثاله في ملخص الطلاب: العمرة الواجبة، وفي هامش نسختك: النذر والكفارة.');
F('w','الإلزام في الواجب المطلق منصبّ على الفعل وعلى وقت معين.','في المطلق منصب على الفعل فقط. أما في المقيد فعلى الفعل وعلى وقت معين.','ص49.');
T('w','المادة الخمسون من نظام الأحوال المدنية (مراجعة الأحوال خلال ستين يوماً من عقد الزواج) مثال للواجب المقيد.','ص49.');
T('w','من أدى الواجب في وقته مختل الأركان أو الشروط فعليه الإعادة، وتكون الإعادة واجبة.','ص49.');
F('w','أداء الواجب في وقته كامل الأركان والشروط يسمى قضاء.','يسمى أداء. والقضاء فعله بعد وقته.','ص49.');
T('w','إخراج زكاة المال قبل وقتها بسنة أو سنتين يسمى تعجيلاً، وهو جائز.','ص49.');
F('w','من صلى الظهر قبل وقتها برئت ذمته من وجوبها.','لا يجوز تعجيلها، فتكون نفلاً، ولا تبرأ ذمته من وجوب الظهر.','ص50.');
F('w','أداء الواجب بعد وقته يسمى إعادة.','يسمى قضاء. والإعادة تكون في الوقت لخلل في الأركان أو الشروط.','ص50.');
T('w','من أخّر الواجب عن وقته لعذر شرعي فعليه القضاء بلا إثم.','ص50: وبدون عذر عليه الإثم مع وجوب القضاء.');
T('w','الشرط الجزائي في القانون مثال على التأخير عن الوقت المحدد للفعل المتفق عليه بين المتعاقدين.','ص50.');
T('w','الواجب الموسع: الواجب المؤقت الذي يتسع وقته لأدائه وأداء غيره من جنسه.','ص50: مثل الصلوات الخمس.');
F('w','صيام رمضان من الواجب الموسع.','صيام رمضان واجب مضيّق، يستغرق اليوم كله، والوقت معيار له.','ص50–51.');
T('w','لا يستطيع المكلف أن يصوم في شهر رمضان تطوعاً أو نذراً أو قضاء.','ص51: لأن الوقت بقدر الواجب.');
T('w','يُمثَّل للواجب المضيّق بوقت الأجير الخاص كموظفي الشركات.','ص51.');
F('w','العزيمة هي الحكم الثابت على خلاف الدليل لعذر.','هذا تعريف الرخصة. العزيمة: الحكم الثابت على وفق الدليل.','ص51.');
T('w','الرخصة: الحكم الثابت على خلاف الدليل لعذر.','ص51.');
F('w','لا فرق بين العزيمة والرخصة.','العزيمة على وفق الدليل، والرخصة على خلافه لعذر.','ص51.');
T('w','أكل الميتة للمضطر رخصة واجبة، فإن امتنع ومات أو لحقه ضرر أثم.','ص51.');
F('w','الجمع والقصر في السفر رخصة مباحة.','الجمع والقصر رخصة مندوبة. ومن الرخص المباحة: عقد الإيجار والنظر للمخطوبة وبيع العرايا.','ص51.');
T('w','النظر إلى المخطوبة رخصة مباحة.','ص51.');
T('w','سماع شهادة الشاهد المريض في مكان وجوده (المادة 100 من الإجراءات الجزائية) مثال للرخصة.','ص52.');
T('w','خيار المرأة في إقامة دعواها في بلدها في المسائل الزوجية والحضانة والزيارة مثال للرخصة.','ص52: استثناء من وجوب إقامة الدعوى في مكان المدعى عليه.');
T('w','الواجب المحدد: ما عيّن له الشارع مقداراً معلوماً، ولا تبرأ الذمة إلا بأدائه على ما عيّن.','ص53.');
F('w','التعزير من أمثلة الواجب المحدد.','التعزير من أمثلة الواجب غير المحدد، لأن القصد تحقيق العدالة وهي تختلف باختلاف الأشخاص والأزمان.','ص54.');
T('w','النفقة من أمثلة الواجب غير المحدد.','ص54: لأن المقصود بها سد الحاجة، ومقدارها يختلف.');
F('w','الزكاة من أمثلة الواجب غير المحدد.','الزكاة من أمثلة الواجب المحدد.','ص53.');
T('w','الواجب المعيّن: ما وجب فيه واحد بعينه، لا خيار في فعله ولا بدل فيه.','ص55.');
F('w','خصال كفارة اليمين مثال للواجب المعيّن.','خصال كفارة اليمين مثال للواجب المخيّر.','ص56.');
T('w','الواجب المخيّر: ما وجب في شيء مبهم من أمور محصورة معينة.','ص56.');
T('w','المادة الثالثة من نظام الشركات (اتخاذ الشركة أحد الأشكال المحددة) مثال للواجب المخيّر.','ص56.');
F('w','فرض الكفاية: الواجب الذي يُطلب فعله من جميع المكلفين، ويأثم كل إنسان بتركه.','هذا تعريف فرض العين. فرض الكفاية يُطلب من مجموع المكلفين.','ص57.');
T('w','إقامة الصلاة من الواجب العيني.','ص57.');
T('w','القضاء والفتيا وتعلم الطب والهندسة من فروض الكفاية.','ص57.');
T('w','إذا قام بفرض الكفاية من يكفي سقط الإثم عن الباقين.','ص57.');
T('w','الواجب الكفائي يسمى «الواجب العام» أو «الواجب الاجتماعي» أو «الواجب التضامني».','ص58.');
T('w','صلاة الجمعة واجب عيني، وبناء المساجد فرض كفاية.','ص58: الفرض العيني لا يقوم إلا بالكفائي.');
F('w','لا يمكن أن ينقلب فرض الكفاية إلى فرض عين.','قد ينقلب في حالات: إذا لم يوجد إلا شخص واحد، أو عيّن الإمام رجلاً، أو شرع فيه، أو غلب على ظنه أن غيره لم يقم به.','ص58.');
T('w','من شرع في صلاة الجنازة أصبحت واجباً عينياً في حقه.','ص58.');
T('w','إيجاب استخراج بطاقة مدنية لكل من يقيم في السعودية مثال لفرض العين.','ص57.');
F('w','صلاة الوتر مثال للسنة الكفائية.','الوتر سنة عينية. والسنة الكفائية مثل إلقاء السلام.','ص57.');
T('w','صلاة الفجر مثال للواجب المقيد والمحدد والمعيّن والعيني في الوقت نفسه.','ص65 (سؤال الكتاب).');
M('w','«لِيُنفِق ذو سعة من سعته» صيغة الوجوب فيها:',['المضارع المقترن بلام الأمر','فعل الأمر','اسم فعل الأمر','لفظ «كتب»'],'ص46.');
M('w','«عليكم أنفسكم» صيغة الوجوب فيها:',['اسم فعل الأمر','فعل الأمر','المضارع المقترن بلام الأمر','الوعيد على الترك'],'ص46: أي الزموا أنفسكم.');
M('w','«اسجدوا لآدم» صيغة الوجوب فيها:',['فعل الأمر','اسم فعل الأمر','لفظ «فرض»','المضارع المقترن بلام الأمر'],'ص63.');
M('w','«كُتب عليكم القصاص» صيغة الوجوب فيها:',['لفظ «كتب»','فعل الأمر','الوعيد على الترك','لفظ «فرض»'],'ص47 وص63.');
M('w','«إن الله يأمر بالعدل والإحسان» صيغة الوجوب فيها:',['لفظ «الأمر» وما اشتق منه','فعل الأمر','اسم فعل الأمر','لفظ «كتب»'],'ص47.');
M('w','الواجب الذي طلب الشارع فعله دون أن يقيد أداءه بوقت معين:',['الواجب المطلق','الواجب المقيد','الواجب المضيق','الواجب المحدد'],'ص47.');
M('w','الإلزام فيه منصبّ على الفعل وعلى وقت معين:',['الواجب المقيد','الواجب المطلق','الواجب المخيّر','فرض الكفاية'],'ص49.');
M('w','أداء الواجب بعد وقته يسمى:',['قضاء','أداء','إعادة','تعجيلاً'],'ص50.');
M('w','أداء الواجب في وقته مختل الأركان أو الشروط يوجب:',['الإعادة','القضاء','الكفارة','لا شيء'],'ص49.');
M('w','إخراج زكاة الفطر قبل ليلة العيد يسمى:',['تعجيلاً','قضاء','إعادة','أداء'],'ص49.');
M('w','الصلوات الخمس مثال للواجب:',['الموسع','المضيق','المخيّر','غير المحدد'],'ص50 وص60.');
M('w','الحكم الثابت على وفق الدليل:',['العزيمة','الرخصة','المباح','المكروه'],'ص51.');
M('w','الجمع والقصر في السفر:',['رخصة مندوبة','رخصة واجبة','رخصة مباحة','عزيمة'],'ص51.');
M('w','أكل الميتة للمضطر:',['رخصة واجبة','رخصة مندوبة','رخصة مباحة','عزيمة'],'ص51.');
M('w','إقامة الدعوى في بلد المدعى عليه (حسب مخطط الكتاب):',['عزيمة','رخصة'],'ص60.');
M('w','المادة 46 من نظام الأحوال الشخصية «يراعى في تقدير النفقة حال المنفق عليه وسعة المنفق» مثال للواجب:',['غير المحدد','المحدد','المخيّر','المطلق'],'ص54.');
M('w','المادة 52 من نظام العمل (ما يجب أن يحتويه عقد العمل) مثال للواجب:',['المحدد','غير المحدد','المخيّر','الكفائي'],'ص53.');
M('w','عقوبة «السجن مدة لا تتجاوز سنة وبغرامة لا تتجاوز ألفي ريال أو بإحدى هاتين العقوبتين» (تزييف النقود) مثال للواجب:',['المخيّر','المعيّن','المحدد','العيني'],'ص56–57: ترك للقاضي الخيار.');
M('w','النفقة للمعتدة من طلاق رجعي (حسب مخطط الكتاب) مثال للواجب:',['المعيّن','المخيّر','غير المحدد','الكفائي'],'ص55 وص61.');
M('w','المادة 34 من النظام الأساسي للحكم «الدفاع عن العقيدة الإسلامية والمجتمع والوطن واجب على كل مواطن» مثال لـ:',['فرض العين','فرض الكفاية','الرخصة','الواجب المخيّر'],'ص57.');
M('w','من الحالات التي ينقلب فيها فرض الكفاية فرض عين:',['إذا لم يوجد إلا شخص واحد يستطيع القيام به','إذا كثر القادرون عليه','إذا كان وقته موسعاً','إذا كان الفعل مسكوتاً عنه'],'ص58.');
M('w','الواجب الذي يطلب فعله من مجموع المكلفين:',['فرض الكفاية','فرض العين','الواجب المعيّن','الواجب المضيق'],'ص57.');

/* ===== المندوب والحرام والمكروه والمباح ===== */
T('n','المندوب لغة: اسم مفعول من الندب وهو الدعاء، فمعناه المدعو إليه.','ص65.');
T('n','المندوب اصطلاحاً: ما طلب الشرع فعله طلباً غير جازم.','ص65.');
T('n','الأمر المقترن بما يدل على جواز الترك من طرق معرفة المندوب.','ص65.');
T('n','الترغيب في الفعل بذكر ثوابه من غير أمر من طرق معرفة المندوب.','ص65.');
F('n','مدح فاعل الفعل من طرق معرفة الحرام.','مدح الفاعل من طرق معرفة المندوب. أما الحرام فيُعرف بذم فاعله.','ص66.');
T('n','بيان محبة الله للفعل من طرق معرفة المندوب.','ص66.');
T('n','فعل الرسول ﷺ للفعل تقرباً من غير أن يأمر به يدل على الندب، مثل الاعتكاف.','ص66.');
T('n','المستحبات تتفاوت في تأكدها، بعضها أعلى من بعض.','ص66.');
T('n','الوتر وركعتا الفجر أشد المستحبات تأكداً، لأن النبي ﷺ لم يكن يتركهما حضراً ولا سفراً.','ص66.');
F('n','تحية المسجد من النوافل المطلقة.','تحية المسجد من النوافل ذوات الأسباب، مثل ركعتي الطواف وصوم عاشوراء ويوم عرفة.','ص66.');
T('n','النوافل المطلقة تُفعل عندما ينشط لها المرء، وإن تركها فلا حرج.','ص66.');
T('n','الأفضل لمن فعل المندوبات أن يداوم عليها.','ص66.');
T('n','الحرام لغة: ضد الحلال، وهو الممنوع.','ص68.');
T('n','الحرام اصطلاحاً: ما يُذم شرعاً فاعله.','ص68.');
F('n','النهي المقترن بقرينة تدل على الكراهة من طرق معرفة الحرام.','الحرام يُعرف بالنهي من غير أن تصحبه قرينة تدل على الكراهة.','ص69.');
T('n','النهي من غير قرينة هو أكثر الأساليب استعمالاً للدلالة على التحريم.','ص69.');
T('n','النص على الخبر بتحريم الفعل من طرق معرفة الحرام.','ص69.');
T('n','طلب اجتناب الفعل من طرق معرفة الحرام.','ص69.');
T('n','توعّد الفاعل بالعقاب من طرق معرفة الحرام.','ص69.');
F('n','الحرام لذاته: ما تكون مفسدته ناشئة من وصف قام به لا من ذاته.','هذا تعريف الحرام لغيره. الحرام لذاته: ما كان مفسدة في ذاته.','ص70.');
T('n','القتل والسرقة وأكل لحم الخنزير من الحرام لذاته.','ص70.');
F('n','البيع وقت نداء الجمعة الثاني من الحرام لذاته.','هو من الحرام لغيره، ومثله الصلاة في المقبرة.','ص70.');
T('n','قد يُطلق الحرام لغيره على ما حُرّم لكونه وسيلة إلى الحرام، مثل تجصيص القبر.','ص70.');
T('n','يغلب في النصوص القانونية استعمال لفظ «لا يجوز» للدلالة على التحريم، وقد يُستعمل «يُمنع» و«يُحظر».','ص70.');
T('n','قد تُفهم صيغة التحريم في الأنظمة من ترتيب العقاب على من قام بالفعل المجرَّم.','ص70.');
T('n','المكروه لغة: المبغَض.','ص75.');
F('n','المكروه اصطلاحاً: ما نهى عنه الشرع نهياً جازماً.','المكروه: ما نهى عنه الشرع نهياً غير جازم.','ص75.');
T('n','النهي عن المشي بنعل واحدة يدل على الكراهة، لأنه خرج مخرج التأديب.','ص75.');
T('n','أكل الثوم والبصل مثال لما يترتب على فعله الحرمان من فضيلة، وهو من طرق معرفة المكروه.','ص76.');
T('n','المباح لغة: من الإباحة، وهي الإذن والإطلاق، والمباح ضد المحظور.','ص77.');
T('n','المباح شرعاً: ما خيّر الشرع فيه بين الفعل والترك.','ص77.');
T('n','التخيير بين الفعل والترك يفيد الإباحة.','ص77.');
T('n','نفي الإثم والمؤاخذة من طرق معرفة الإباحة.','ص78.');
T('n','النص على الحِلّ من طرق معرفة الإباحة.','ص78.');
T('n','الأمر بعد النهي لا يفيد الوجوب.','ملخص الطلاب ص3، ومثاله: «كنت نهيتكم عن زيارة القبور ألا فزوروها». والكتاب ص78 يعد الأمر بعد الحظر من طرق معرفة الإباحة.');
T('n','الأمر بعد النهي (الحظر) يفيد الإباحة.','ص78: «الأمر الوارد بعد الحظر» من طرق معرفة الإباحة.');
F('n','الأصل في الأشياء المنتفع بها التحريم.','الأصل في الأشياء المنتفع بها الحل، فالمسكوت عنه مباح.','ص78.');
T('n','الفعل الواحد قد تعتريه الأحكام كلها أو بعضها بحسب ما يلابسه.','ص78: مثل الزواج.');
T('n','الزواج يكون واجباً إذا قدر على المهر والنفقة وخاف الزنا إن لم يتزوج.','ص78.');
T('n','الزواج يكون محرماً إذا تيقن أنه يظلم زوجته ولا يقوم بحقوقها.','ص78.');
T('n','فعل المباحات باب واسع للثواب إذا احتسب المسلم فيها نية صالحة.','ص79.');
F('n','يغلب على الأنظمة السعودية استخدام لفظ «يجوز» لبيان التحريم.','لفظ «يجوز» لبيان الإباحة، و«لا يجوز» للتحريم.','ص70 وص79.');
M('n','ما طلب الشرع فعله طلباً غير جازم:',['المندوب','الواجب','المكروه','المباح'],'ص65.');

M('n','من طرق معرفة الحرام:',['طلب اجتناب الفعل','مدح فاعله','النص على الحل','نفي الإثم'],'ص69.');
M('n','من طرق معرفة المكروه:',['أن يترتب على فعله الحرمان من فضيلة','توعّد الفاعل بالعقاب','النص على تحريمه','مدح فاعله'],'ص76.');
M('n','من طرق معرفة المباح:',['النص على الحل','ذم فاعله','بيان محبة الله للفعل','النهي من غير قرينة'],'ص78.');
M('n','«فإذا قُضيت الصلاة فانتشروا في الأرض» تدل على الإباحة بطريق:',['الأمر الوارد بعد الحظر','النص على التخيير','نفي الإثم والمؤاخذة','كون الفعل مسكوتاً عنه'],'ص78.');
M('n','الانتفاع بوسائل النقل والاتصال الحديثة مباح لأن الفعل:',['مسكوت عنه، والأصل في الأشياء المنتفع بها الحل','ورد فيه أمر بعد حظر','ورد فيه نص على التخيير','ورد فيه نفي الإثم'],'ص78.');
M('n','أكثر الأساليب استعمالاً للدلالة على التحريم:',['النهي من غير قرينة تدل على الكراهة','ذم الفاعل','توعّد الفاعل بالعقاب','طلب اجتناب الفعل'],'ص69.');

M('n','السرقة:',['حرام لذاته','حرام لغيره','مكروه'],'ص70.');
M('n','المشي بنعل واحدة:',['مكروه','حرام','مباح','مندوب'],'ص75.');
M('n','تحية المسجد وصوم يوم عرفة من:',['النوافل ذوات الأسباب','النوافل المطلقة','السنن التي لم تُترك حضراً ولا سفراً'],'ص66.');
M('n','الزواج لمن قدر عليه وكان في حال اعتدال لا يخاف الزنا:',['مندوب','واجب','محرم','مكروه'],'ص78.');
M('n','المادة 12 من نظام المرافعات «لا يجوز إجراء أي تبليغ في مكان الإقامة قبل شروق الشمس ولا بعد غروبها…» مثال لـ:',['الحرام','المباح','الواجب','المكروه'],'ص70.');
M('n','المادة 66 من نظام الإثبات «يجوز الإثبات بشهادة الشهود ما لم يرد نص يقضي بغير ذلك» مثال لـ:',['المباح','الحرام','الواجب','المندوب'],'ص79.');
M('n','المادة 32 من نظام المرور «يحظر على أي شخص قيادة أي مركبة قبل الحصول على رخصة القيادة» مثال لـ:',['الحرام','المكروه','الواجب المخيّر','المباح'],'ص72.');

/* ===== الحكم الوضعي ===== */
T('v','الحكم الوضعي: خطاب الله تعالى بجعل الشيء سبباً أو شرطاً أو مانعاً أو صحيحاً أو فاسداً.','ص84.');
T('v','السبب: ما يلزم من وجوده الوجود، ومن عدمه العدم.','ص84.');
T('v','الزنا سبب لوجوب الحد، فإذا ثبت الزنا ثبت الحد، وإذا انتفى انتفى.','ص84.');
T('v','دخول الوقت لوجوب الصلاة، وغروب الشمس لجواز الفطر، أسباب ترتبط بها أحكامها وجوداً وعدماً.','ص84.');
F('v','دخول الوقت لوجوب الصلاة سبب في قدرة المكلف.','هو سبب ليس فعلاً للمكلف ولا مقدوراً له.','ص85.');
T('v','السفر لإباحة الفطر سبب في قدرة المكلف.','ص85: ومثله القتل العمد العدوان لوجوب القصاص.');
T('v','الجنون سبب لوجوب الحجر.','ص84–85.');
T('v','الأسباب تترتب عليها أحكامها إذا وُجدت، وتحققت الشروط، وانتفت الموانع.','ص85.');
F('v','الشرط: ما يلزم من وجوده الوجود، ومن عدمه العدم.','هذا تعريف السبب. الشرط: ما يلزم من عدمه العدم، ولا يلزم من وجوده وجود ولا عدم.','ص87.');
T('v','الشرط: ما يلزم من عدمه العدم، ولا يلزم من وجوده وجود ولا عدم.','ص87.');
T('v','الشاهدان في النكاح شرط، فلا يصح النكاح بدونهما، ولا يلزم من وجودهما وجود العقد.','ص87.');
F('v','السبب لا يختلف عن الشرط.','يختلفان: السبب يلزم من وجوده الوجود، والشرط لا يلزم من وجوده وجود ولا عدم.','ص84 وص87.');
F('v','لا يوجد فرق بين الشرط والسبب.','بينهما فرق: السبب يلزم من وجوده وجود الحكم، أما الشرط فلا يلزم من وجوده شيء.','ص84 وص87.');
T('v','الركن جزء من حقيقة الشيء، والشرط أمر خارج عن حقيقته.','ص87.');
F('v','الطهارة ركن من أركان الصلاة.','الطهارة شرط للصلاة لأنها خارجة عن حقيقتها، والركوع ركن لأنه جزء منها.','ص87.');
T('v','الإيجاب والقبول ركن في عقد النكاح، وحضور الشاهدين شرط لصحته.','ص87.');
F('v','الشرط الجعلي: ما اشترطه الشارع للأحكام والتصرفات.','هذا الشرط الشرعي. الشرط الجعلي: ما اشترطه المكلف.','ص88.');
T('v','اشتراط الشاهدين في النكاح شرط شرعي.','ص96.');
T('v','اشتراط المشتري نقل المبيع إلى مكان معين شرط جعلي.','ص88.');
T('v','لا بد أن يكون الشرط الجعلي موافقاً لحكم الشرع ومتفقاً مع مقتضى العقد.','ص88.');
T('v','الشرط الجعلي المكمل لحكمة الشرع، كاشتراط الكفالة أو الرهن في الدين المؤجل، متفق على صحته.','ص89.');
F('v','اشتراط الزوج عدم الإنفاق على زوجته شرط جعلي صحيح.','هو شرط مخالف لمقتضى العقد، متفق على بطلانه وإلغائه.','ص89.');
F('v','حسب نظام الأحوال الشخصية: إذا كان الشرط منافياً لمقتضى العقد بطل عقد الزواج.','يصح عقد الزواج ويبطل الشرط (فقرة 2 من المادة 29).','ص89.');
T('v','الشرط الزائد على مقتضى العقد مختلف فيه، والحنابلة على جوازه والتوسع فيه.','ص89.');
T('v','المانع: ما يلزم من وجوده العدم، ولا يلزم من عدمه وجود ولا عدم.','ص89.');
F('v','يلزم من عدم المانع العدم.','المانع يلزم من وجوده العدم، ولا يلزم من عدمه وجود ولا عدم.','ص89.');
T('v','القتل مانع من التوارث بين القاتل والمقتول.','ص89.');
T('v','لا يلزم من عدم القتل وجود الميراث، فقد لا يحصل لمانع آخر كدين يستغرق مال المورّث.','ص89.');
T('v','معنى صحة الفعل: ترتّب آثاره الشرعية عليه.','ص90.');
T('v','معنى بطلان الفعل: عدم ترتب آثاره الشرعية عليه.','ص91.');
T('v','لا فرق في العبادات بين الفساد والبطلان، عدا الحج، باتفاق الفقهاء.','ص91.');
T('v','الجمهور يرون أن العقد غير الصحيح قسم واحد، والفاسد والباطل مترادفان.','ص91.');
F('v','عند الحنفية: إذا حدث خلل في ركن العقد فهو فاسد.','عند الحنفية: الخلل في الركن يجعله باطلاً، والخلل في الشرط أو الوصف يجعله فاسداً.','ص91.');
T('v','الباطل عند الحنفية: ما كان غير مشروع لا بأصله ولا بوصفه.','ص91.');
T('v','الفاسد عند الحنفية: ما كان مشروعاً بأصله لا بوصفه.','ص91.');
T('v','البيع مع جهالة الثمن فاسد عند الحنفية.','ص91.');
T('v','بيع المجنون باطل عند الحنفية.','ص91.');
T('v','رتّب الحنفية على الزواج الفاسد المهر والعدة، وأثبتوا النسب.','ص91.');
F('v','تميل الأنظمة السعودية إلى قول الجمهور في تقسيم العقود غير الصحيحة.','تميل إلى مذهب الحنفية في تقسيمها إلى فاسدة وباطلة.','ص92.');
F('v','في نظام الأحوال الشخصية: الزواج بلا شهود زواج باطل.','الزواج بلا شهود زواج فاسد. والباطل يكون بتخلف أحد الأركان أو عدم تعيين الزوجين أو عدم رضاهما.','ص92.');
T('v','في نظام الأحوال الشخصية: الزواج يكون باطلاً بتخلف أحد الأركان أو عدم تعيين الزوجين أو عدم رضاهما.','ص92.');
T('v','الحكم التكليفي لا يوصف به إلا فعل المكلف، وهو البالغ العاقل.','ص93.');
T('v','الصبي إذا أتلف شيئاً لغيره انعقد سبب الضمان، لأن الحكم الوضعي لا يختلف باختلاف الفاعل.','ص93.');
F('v','الحكم الوضعي يشترط فيه علم المكلف.','العلم من شروط الحكم التكليفي. الوضعي لا يشترط العلم به.','ص93.');
F('v','خطاب الوضع يُشترط فيه قدرة المكلف.','قدرة المكلف شرط في خطاب التكليف، أما خطاب الوضع فليس من شرطه ذلك.','ص93.');
T('v','موت المورّث سبب للإرث، وليس من فعل الوارث ولا داخلاً تحت قدرته.','ص93.');
T('v','القرابة سبب للميراث، وليست من كسب الإنسان.','ص94.');

M('v','الزنا بالنسبة لوجوب الحد:',['سبب','شرط','مانع','ركن'],'ص84.');
M('v','الركوع بالنسبة للصلاة:',['ركن','شرط','سبب','مانع'],'ص87.');

M('v','ما يلزم من وجوده العدم، ولا يلزم من عدمه وجود ولا عدم:',['المانع','الشرط','السبب','الصحة'],'ص89.');
M('v','مثال للسبب الذي ليس فعلاً للمكلف ولا مقدوراً له:',['غروب الشمس لجواز الفطر','السفر لإباحة الفطر','القتل العمد العدوان لوجوب القصاص','السرقة لوجوب الحد'],'ص85.');
M('v','الشرط الذي يشترطه المكلف:',['الشرط الجعلي','الشرط الشرعي','الركن','السبب'],'ص88.');
M('v','اشتراط الكفالة أو الرهن في الدين المؤجل:',['شرط جعلي متفق على صحته','شرط جعلي متفق على بطلانه','شرط جعلي مختلف فيه','شرط شرعي'],'ص89.');
M('v','الشرط الجعلي الزائد على مقتضى العقد:',['مختلف فيه، والحنابلة على جوازه','متفق على صحته','متفق على بطلانه'],'ص89.');

M('v','النكاح بدون شهود عند الحنفية:',['فاسد','باطل','صحيح','موقوف'],'ص91.');
M('v','المادة 55 من نظام الأحوال الشخصية «يسقط حق الزوجة في النفقة إذا منعت نفسها من الزوج…» بيّنت:',['الأسباب التي يترتب عليها سقوط النفقة','الشروط الجعلية','الموانع','الرخص'],'ص85.');
M('v','المادة 13 من نظام الأحوال الشخصية «يشترط لصحة عقد الزواج: تعيين الزوجين، ورضا الزوجين» مثال لـ:',['الشرط الشرعي','الشرط الجعلي','السبب','المانع'],'ص88.');
M('v','من الفروق بين الحكم التكليفي والوضعي:',['التكليفي من شرطه العلم، والوضعي لا يشترط فيه العلم','الوضعي لا يوصف به إلا فعل المكلف','الوضعي يشترط فيه قدرة المكلف','التكليفي لا يشترط أن يكون من كسب العبد'],'ص93–94.');
M('v','الجهة التي تميل الأنظمة السعودية لمذهبها في تقسيم العقود غير الصحيحة:',['الحنفية','الجمهور'],'ص92.');

/* ===== المحكوم عليه ===== */
T('a','المحكوم عليه: المكلف الذي تعلّق حكم الشارع بفعله.','ص101.');
F('a','يشترط في المكلف لصحة تكليفه شرعاً ثلاثة شروط.','يشترط شرطان: أن يكون قادراً على فهم دليل التكليف، وأن يكون أهلاً لما كُلّف به.','ص101–103.');
T('a','يشترط لصحة التكليف أن يكون المكلف قادراً على فهم دليل التكليف.','ص101.');
T('a','ربط الشارع التكليف بالبلوغ لأنه أمر ظاهر يُدرك بالحس، وهو مظنة للعقل.','ص101.');
F('a','الغافل والنائم والسكران مكلفون حال الغفلة والنوم والسكر.','لا يُكلَّفون لأنهم ليس في استطاعتهم الفهم في تلك الحال.','ص101.');
F('a','إيجاب الزكاة والنفقة والضمان في مال الصبي والمجنون تكليف لهما.','ليس تكليفاً لهما، وإنما هو تكليف للولي بأداء الحق المالي من مالهما.','ص102.');
T('a','من لا يعرف العربية، ولم تترجم له الأدلة، ولم يقم أحد بتعليمه، فهو شرعاً غير مكلف.','ص102.');
F('a','الملجأ (المكره) مكلف لأنه قادر على فهم الخطاب.','الملجأ غير مكلف لكونه غير مؤهل لما كُلّف به، إذ لا رضا عنده ولا اختيار.','ص103.');
T('a','الأهلية: صلاحية الإنسان لوجوب الحقوق المشروعة له وعليه، والإتيان بالتصرفات منه.','ص103.');
T('a','أهلية الوجوب: صلاحية الإنسان لوجوب الحقوق له وعليه.','ص103.');
F('a','مناط أهلية الوجوب هو التمييز بالعقل.','مناط أهلية الوجوب وجود الذمة. والتمييز بالعقل مناط أهلية الأداء.','ص103.');
T('a','تتعلق الحقوق والواجبات بالمؤسسة أو الشركة باعتبارها شخصاً معنوياً.','ص103.');
T('a','تثبت أهلية الوجوب للجنين في بطن أمه، وتكون ناقصة.','ص103.');
T('a','بأهلية الوجوب الناقصة يكون الجنين أهلاً لاستحقاق الإرث والوصية وغلة الوقف.','ص103.');
F('a','أهلية الوجوب الكاملة تثبت للإنسان من بلوغه إلى موته.','تثبت من ولادته إلى موته.','ص103.');

const KEY='usul-quiz-v1';
let st={a:{}};
try{const r=localStorage.getItem(KEY);if(r)st=JSON.parse(r)||{a:{}};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
Q.forEach((q,i)=>q.id=i);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const wrongIds=()=>Q.filter(q=>st.a[q.id]===0).map(q=>q.id);

function home(){
  const done=Object.keys(st.a).length, right=Object.values(st.a).filter(v=>v===1).length, wr=wrongIds().length;
  let h=`<header><h1>بنك أسئلة أصول الفقه</h1><p class="sub">«معالم في أصول الفقه» من ص13 إلى ص124 · ${ar(Q.length)} سؤالاً صح وخطأ واختيار من متعدد</p></header>
  <div class="stats"><div class="stat"><b>${ar(done)}</b><span>جاوبت</span></div><div class="stat"><b>${ar(right)}</b><span>صح</span></div><div class="stat"><b>${ar(wr)}</b><span>أخطاؤك الحالية</span></div></div>
  <div class="actions">
    <button class="btn" data-go="all">ابدأ كل الأسئلة بالترتيب</button>
    <button class="btn alt" data-go="past">★ أسئلة جاءت في اختبار سابق (${ar(Q.filter(q=>q.x).length)})</button>
    <button class="btn warn" data-go="wrong" ${wr?'':'disabled'}>راجع أخطاءك (${ar(wr)})</button>
  </div>
  <p class="note">الأسئلة بنفس ترتيب الكتاب داخل كل قسم، واللي عليها «★ جاء في اختبار سابق» جات بنفس صياغتها في الاختبار. إذا غلطت في سؤال ينحفظ في «راجع أخطاءك»، ويطلع منها إذا جاوبته صح.</p>
  <h2>الأقسام</h2><div class="secs">`;
  S.forEach(s=>{
    const qs=Q.filter(q=>q.s===s.k), d=qs.filter(q=>q.id in st.a).length;
    h+=`<button class="sec" data-go="s:${s.k}"><span class="t">${s.name}${s.mid?'':'<span class="tag">بعد الميد</span>'}</span><span class="n">${ar(d)}/${ar(qs.length)}</span><span class="p">${s.pages}</span><span class="bar"><i style="width:${qs.length?d/qs.length*100:0}%"></i></span></button>`;
  });
  h+=`</div><div class="actions" style="margin-top:20px"><button class="btn alt" data-go="reset">ابدأ من جديد (امسح التقدّم)</button></div>`;
  app.innerHTML=h;
}

let run=null;
function start(ids,title){run={ids,i:0,title,score:0,answered:false};show();}
function show(){
  if(run.i>=run.ids.length)return finish();
  const q=Q[run.ids[run.i]];run.answered=false;
  const sec=S.find(s=>s.k===q.s);
  let opts;
  if(q.t==='tf')opts=`<div class="opts tf"><button class="opt" data-v="1">صح</button><button class="opt" data-v="0">خطأ</button></div>`;
  else{run.order=shuffle(q.o.map((t,i)=>({t,i})));opts=`<div class="opts">${run.order.map(o=>`<button class="opt" data-v="${o.i}">${esc(o.t)}</button>`).join('')}</div>`;}
  app.innerHTML=`<div class="top"><button class="back" data-go="home">→ الأقسام</button><span class="count">${ar(run.i+1)} / ${ar(run.ids.length)}</span></div>
  <div class="prog"><i style="width:${run.i/run.ids.length*100}%"></i></div>
  <div class="card"><div class="kind"><span>${sec.name} · ${q.t==='tf'?'صح أو خطأ':'اختيار من متعدد'}</span>${q.x?'<span class="past">★ جاء في اختبار سابق</span>':''}</div><p class="q">${esc(q.q)}</p>${opts}<div id="fb"></div></div>`;
}
function answer(v){
  if(run.answered)return;run.answered=true;
  const q=Q[run.ids[run.i]];
  let ok;
  const btns=[...app.querySelectorAll('.opt')];
  if(q.t==='tf'){ok=(v==='1')===q.a;btns.forEach(b=>{if((b.dataset.v==='1')===q.a)b.classList.add('right');else if(b.dataset.v===v)b.classList.add('wrong');b.disabled=true;});}
  else{ok=v==='0';btns.forEach(b=>{if(b.dataset.v==='0')b.classList.add('right');else if(b.dataset.v===v)b.classList.add('wrong');b.disabled=true;});}
  st.a[q.id]=ok?1:0;save();if(ok)run.score++;
  let fb=`<div class="fb ${ok?'ok':'no'}"><span class="h">${ok?'إجابة صحيحة':'إجابة خاطئة'}</span>`;
  if(q.t==='tf')fb+=`الجواب: <b>${q.a?'صح':'خطأ'}</b>`;
  else fb+=`الجواب: <b>${esc(q.o[0])}</b>`;
  if(q.c)fb+=`<span class="c">التصحيح: <b>${esc(q.c)}</b></span>`;
  fb+=`<span class="c" style="font-weight:400">${esc(q.e)}</span></div>
  <div class="nav"><button class="btn" data-go="next">${run.i+1<run.ids.length?'التالي ←':'النتيجة'}</button></div>`;
  document.getElementById('fb').innerHTML=fb;
  app.querySelector('[data-go="next"]').focus();
}
function finish(){
  const n=run.ids.length,p=Math.round(run.score/n*100),wr=wrongIds().length;
  app.innerHTML=`<div class="top"><button class="back" data-go="home">→ الأقسام</button></div>
  <div class="card end"><div class="big">${ar(run.score)} / ${ar(n)}</div><p>${run.title} · ${ar(p)}٪</p>
  <div class="actions"><button class="btn warn" data-go="wrong" ${wr?'':'disabled'}>راجع أخطاءك (${ar(wr)})</button><button class="btn alt" data-go="home">ارجع للأقسام</button></div></div>`;
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const o=e.target.closest('.opt');if(o&&run&&!run.answered){answer(o.dataset.v);return;}
  const b=e.target.closest('[data-go]');if(!b||b.disabled)return;
  const g=b.dataset.go;
  if(g==='home'){run=null;home();window.scrollTo(0,0);}
  else if(g==='next'){run.i++;show();window.scrollTo(0,0);}
  else if(g==='mid')start(Q.filter(q=>S.find(s=>s.k===q.s).mid).map(q=>q.id),'أسئلة الميد');
  else if(g==='all')start(Q.map(q=>q.id),'كل الأسئلة');
  else if(g==='wrong')start(shuffle(wrongIds()),'راجع أخطاءك');
  else if(g==='past')start(Q.filter(q=>q.x).map(q=>q.id),'أسئلة جاءت في اختبار سابق');
  else if(g.startsWith('s:')){const k=g.slice(2);start(Q.filter(q=>q.s===k).map(q=>q.id),S.find(s=>s.k===k).name);}
  else if(g==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='اضغط مرة ثانية للتأكيد';setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent='ابدأ من جديد (امسح التقدّم)';},4000);return;}
    st={a:{}};save();resetArmed=false;home();
  }
  if(g!=='next')window.scrollTo(0,0);
});
home();
</script>
