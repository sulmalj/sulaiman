<script>
// T = عبارة صحيحة، F = عبارة خاطئة (مع التصحيح)، M = اختيار من متعدد (أول خيار هو الصحيح، والخيارات تنخلط عند العرض)
const S=[
 {k:'t',name:'الفصل التمهيدي: ماهية القانون الدولي الخاص',pages:'ص11–17',mid:1},
 {k:'j',name:'الاختصاص الدولي: النصوص والقاعدة الأصلية',pages:'ص21–45',mid:1},
 {k:'h',name:'المعايير الاحتياطية لثبوت الولاية',pages:'ص46–67',mid:1},
 {k:'n',name:'معايير نفي الولاية عن القضاء السعودي',pages:'ص69–80',mid:1},
 {k:'e',name:'تنفيذ الأحكام الأجنبية',pages:'ص81–101',mid:1},
 {k:'k',name:'قانون التنازع وقاعدة الإسناد',pages:'ص103–109',mid:1},
 {k:'l',name:'القانون واجب التطبيق في القانون المقارن',pages:'ص111–124',mid:1},
 {k:'o',name:'النظام العام والإحالة والغش وإثبات القانون الأجنبي',pages:'ص125–133',mid:1},
 {k:'s',name:'تنازع القوانين أمام القضاء السعودي',pages:'ص135–139',mid:1}
];
const Q=[];
const T=(s,q,e)=>Q.push({s,q,t:'tf',a:true,e});
const F=(s,q,c,e)=>Q.push({s,q,t:'tf',a:false,c,e});
const M=(s,q,o,e)=>Q.push({s,q,t:'mc',o,e});
const X=()=>{Q[Q.length-1].x=1;};

/* ===== الفصل التمهيدي ===== */
T('t','يُعد القانون الدولي الخاص قانوناً حديث النشأة.','ص11: «يُعد القانون الدولي الخاص قانون حديث النشأة».');
M('t','أول من استخدم مصطلح «القانون الدولي الخاص» هو الفقيه:',['ستوري (Story) عام 1834م','فوليكس (Foelix) عام 1843م','سافيني عام 1849م','بارتولس في العصور الوسطى'],'ص11: استُخدم المصطلح أول مرة على يد الفقيه Story عام 1834م، ثم استعمله Foelix عام 1843م، ثم انتشر في الدول.');
F('t','نشأ القانون الدولي الخاص كقانون مستقل بتقنين خاص به، شأنه شأن التقنينات المختلفة.','لم ينشأ كقانون مستقل بتقنين خاص به، وإنما نشأ على يد الفقه في صورة نظريات وآراء متعددة.','ص11.');
M('t','متى ظهر القانون الدولي الخاص كفرع قانوني مستقل؟',['في العصر الحديث','في العصور القديمة','في العصور الوسطى','لم يظهر بعد كعلم قانوني مستقل'],'ص11: هو قانون حديث النشأة، واستُخدم مصطلحه أول مرة عام 1834م. وانتبه: «لم ينشأ بتقنين مستقل» ما يعني إنه ما ظهر كفرع، بل نشأ على يد الفقه.');X();
T('t','إذا كانت العلاقة القانونية وطنية بحتة، كعقد بين سعوديين داخل المملكة بشأن معاملات وطنية، فلا تُثار فكرة تنازع القوانين.','ص11: العلاقة الوطنية البحتة يطبق عليها القانون الوطني بلا خلاف.');
F('t','العلاقة الخاصة الدولية هي فقط العلاقة التي تنشأ بين أفراد من دول مختلفة.','العلاقة الخاصة الدولية: تنطوي على عنصر أجنبي، وتنشأ بين أفراد من دول مختلفة أو أفراد من دولة واحدة ولكن عبر الحدود.','ص11.');
M('t','متى يُعتبر النزاع ذا طابع دولي خاص؟',['عندما يكون بين شخصين يحملان جنسيتين مختلفتين أو خارج حدود وطنهم','عندما يكون بين شخصين يحملان نفس الجنسية','عندما يكون النزاع أمام محكمة دولية','عندما يكون النزاع مرتبطاً بالقانون الدولي العام'],'ص11: العلاقة الخاصة الدولية تنطوي على عنصر أجنبي، بين أفراد من دول مختلفة أو من دولة واحدة عبر الحدود.');X();
M('t','وقع حادث في أمريكا، مرتكبه سعودي، والمجني عليه سوداني مقيم في المملكة. غالباً ما تأخذ الدول في قواعد التنازع هنا بـ:',['القانون الأمريكي، باعتباره قانون الدولة التي نشأ فيها الالتزام','القانون السعودي، باعتباره قانون جنسية مرتكب الحادث','القانون السوداني، باعتباره قانون جنسية المجني عليه','قانون الدولة التي يقيم فيها المجني عليه'],'ص12: القوانين ذات الصلة ثلاثة، و«غالباً ما تأخذ الدول في قواعد التنازع بقانون الدولة الذي نشأ فيها الالتزام، أي القانون الأمريكي».');
T('t','تصور وجود أكثر من قانون قد يحكم العلاقة القانونية كان سبباً من أسباب نشأة القانون الدولي الخاص.','ص12.');
T('t','تعتمد قواعد تنازع القوانين على مركز الثقل في العلاقة القانونية ذات العنصر الأجنبي من وجهة نظر المنظم الوطني.','ص12: ثم تشير إلى القانون واجب التطبيق.');
F('t','يتبنى المنظم الوطني معيار الجنسية كمركز ثقل في الغالب بالنسبة لمسائل الأموال والعقود.','معيار الجنسية كمركز ثقل يكون في الغالب الأعم بالنسبة لمسائل الأحوال الشخصية كالزواج والطلاق.','ص12.');
M('t','سوري يريد إقامة دعوى تعويض على سعودي عن حادث تسبب فيه السعودي في مصر. القضاء السعودي له صلة بالدعوى باعتبار:',['أن المدعى عليه مرتكب الحادث سعودي الجنسية', 'أن الحادث وقع داخل أراضي المملكة', 'أن المدعي يحمل الجنسية السورية', 'أن الضرر تحقق في دولة عربية'],'ص12–13: القضاء المصري لأن الحادث وقع في مصر، والسعودي لأن المدعى عليه سعودي، والسوري لأن المدعي سوري.');
T('t','تصور دخول منازعة ذات عنصر أجنبي في ولاية أكثر من قضاء دولة يُعد سبباً إضافياً لنشأة القانون الدولي الخاص.','ص13.');
T('t','قواعد الاختصاص القضائي الدولي غالباً ما تنتمي إلى قواعد قانون المرافعات.','ص13: «فتحدد قواعده، التي غالباً ما تنتمي إلى قواعد قانون المرافعات، ضوابط اختصاص القضاء الوطني».');
F('t','قيام صلة ما بين العلاقة ذات العنصر الأجنبي وقضاء الدولة يبرر دائماً شمول الدعوى بولاية هذا القضاء.','لا يبرر ذلك على إطلاقه؛ فقد تتوافر صلة ومع ذلك يوجد معيار من معايير نفي الولاية.','ص13.');
T('t','إمكانية تطبيق الأحكام خارج نطاق الدولة الصادر باسمها الحكم من المشاكل التي نشأ القانون الدولي الخاص لحلها.','ص13.');
T('t','انتقال الأفراد بين الدول وطلبهم الرزق أو الاحتماء بدولة أخرى أدى إلى نشأة الحاجة لتنظيم قواعد الجنسية.','ص13.');
M('t','أي مما يلي يُعد أحد أسباب نشأة القانون الدولي الخاص؟',['الحاجة إلى تنظيم العلاقات ذات العنصر الأجنبي','تشابه القوانين بين الدول','عدم وجود قوانين وطنية تحكم العلاقات بين الأفراد','اقتصار التجارة الدولية على نطاق ضيق'],'ص11–14: نشأت الحاجة لقواعد تنظم القانون واجب التطبيق على العلاقات ذات الطابع الأجنبي.');X();
M('t','أي مما يلي يعتبر من دواعي نشأة القانون الدولي الخاص:',['قابلية تطبيق القانون الدولي الخاص على الأجانب','اعتبار القانون الدولي الخاص حديث النشأة','اعتبار القانون الدولي ذو صبغة وطنية','عدم اعتبار القانون الدولي الخاص قانونا دوليا'],'ص11–14: نشأت الحاجة لوضع قواعد تنظم القانون واجب التطبيق على الأجانب والعلاقات ذات الطابع الأجنبي. أما «حديث النشأة» فوصف له مو سبب لنشأته.');X();
M('t','تعتبر قابلية تطبيق القانون الوطني على الأجانب أحد:',['دواعي نشأة القانون الدولي الخاص','خصائص القانون الدولي الخاص','عيوب القانون الدولي الخاص','موضوعات القانون الدولي الخاص'],'ص11–14: من أسباب نشأته الحاجة لقواعد تنظم القانون واجب التطبيق على الأجانب.');X();
M('t','عدد فروع القانون الدولي الخاص كما يأخذ بها المؤلفان:',['خمسة','ثلاثة','أربعة','ستة'],'ص14: الاختصاص الدولي للمحاكم، تنفيذ الأحكام الأجنبية، تنازع القوانين، الجنسية، المعاملة القانونية للأجانب.');
M('t','أي مما يلي لا يعتبر ضمن موضوعات القانون الدولي الخاص :',['النزاعات بين الدول','الجنسية','تنازع القوانين','الاختصاص القضائي','تنفيذ الأحكام الأجنبية'],'ص14: فروعه الخمسة: الاختصاص الدولي للمحاكم، تنفيذ الأحكام الأجنبية، تنازع القوانين، الجنسية، مركز الأجانب. النزاعات بين الدول من القانون الدولي العام.');X();
M('t','الاختصاص القضائي الدولي يعتبر أحد:',['موضوعات القانون الدولي الخاص','خصائص القانون الدولي الخاص','دواعي نشأة القانون الدولي الخاص','عيوب القانون الدولي الخاص'],'ص14: قواعد الاختصاص الدولي للمحاكم الوطنية هي الفرع الأول من فروعه.');X();
M('t','أي مما يلي لا يعتبر من موضوعات القانون الدولي الخاص؟',['العلاقات بين الدول والمنظمات الدولية','الجنسية','تنازع القوانين','الاختصاص القضائي'],'ص14: هذه العلاقات من القانون الدولي العام.');X();
M('t','أي مما يلي يُعد من الموضوعات الأساسية في القانون الدولي الخاص؟',['مركز الأجانب','قانون البحار','قوانين الحرب','العلاقات الدبلوماسية'],'ص14: الفرع الخامس: المعاملة القانونية للأجانب (مركز الأجانب).');X();
M('t','أي من المبادئ التالية لا ينتمي إلى القانون الدولي الخاص؟',['مبدأ التجارة الحرة الدولية','مبدأ تنازع القوانين','مبدأ تحديد الاختصاص القضائي','مبدأ تنفيذ الأحكام الأجنبية'],'ص14: الثلاثة الأخيرة من فروعه.');X();
F('t','المعاملة القانونية للأجانب ليست من فروع القانون الدولي الخاص.','المعاملة القانونية للأجانب هي الفرع الخامس من فروعه.','ص14.');
T('t','بعض قواعد القانون الدولي الخاص ينتمي للقانون العام، وبعضها ينتمي للقانون الخاص.','ص14: في نهاية تعريفه.');
F('t','يقتصر تعريف القانون الدولي الخاص عند المؤلفين على القواعد التي تحدد القانون واجب التطبيق على العلاقات ذات العنصر الأجنبي.','تعريفه يشمل: قواعد ثبوت الولاية للقضاء الوطني ونفيها، والقانون واجب التطبيق، وتنفيذ الأحكام الأجنبية، وتحديد جنسية الوطنيين، والمركز القانوني للأجانب.','ص14.');
M('t','الاتجاه الذي يرى أن موضوع القانون الدولي الخاص هو تنازع القوانين فقط يأخذ به:',['الفقه الألماني','الفقه الفرنسي','الفقه المصري','الفقه الإنجليزي'],'ص15: بالاتجاه الأول (تنازع القوانين فقط) يأخذ الفقه الألماني، وبالثاني (الفروع الخمسة) الفقه الفرنسي.');
T('t','يأخذ الفقه الفرنسي بأن موضوعات القانون الدولي الخاص تشمل الفروع الخمسة، وهو ما يأخذ به المؤلفان.','ص15.');
F('t','وفقاً للاتجاه الذي يقصر القانون الدولي الخاص على تنازع القوانين، فإن قانون الجنسية ينتمي للقانون الخاص.','قانون الجنسية ينتمي للقانون العام، وقانون المرافعات ينتمي للقانون الخاص.','ص15.');
T('t','يرى بعض الفقه أن العلاقة بين شخص من أشخاص القانون الدولي العام وفرد عادي تخضع للقانون الدولي الخاص إذا كانت من العلاقات التي تنشأ بين الأفراد العاديين، كعقود القرض في مجال الاستثمارات الدولية.','ص15: بشرطين: أن تكون بين أفراد وأحد أشخاص القانون الدولي العام، وأن تكون من العلاقات التي تنشأ بين الأفراد العاديين.');
M('t','أي من هذه الخصائص تنطبق على القانون الدولي الخاص؟',['ذو صبغة وطنية تختلف بين الدول','ذو طبيعة دولية بالكامل','موحّد في جميع الدول','ليس له مصادر محددة'],'ص15: «قواعد وضعية وطنية» من وضع المنظم الوطني في كل دولة.');X();
M('t','ما المقصود بكون قواعد القانون الدولي الخاص قواعد وطنية؟',['أنها من وضع المنظم الوطني','أنها تصدر عن المنظمات الدولية','أنها تطبق فقط خارج الدولة','أنها غير ملزمة للدولة'],'ص15: «أفرع القانون الدولي الخاص... هي من وضع المنظم الوطني».');X();
M('t','ما يعتبر المصدر الرسمي للقانون الدولي الخاص في معظم الدول؟',['التشريع الوطني','قرارات الأمم المتحدة','الاجتهاد القضائي الدولي','الاجتهاد القضائي الوطني'],'ص15–16: قواعده وضعية وطنية من وضع المنظم الوطني.');X();
F('t','انضمام الدولة لمعاهدات دولية في مسائل القانون الدولي الخاص ينفي عن قواعده صفة الوطنية.','لا يحول ذلك دون صفتها الوطنية؛ فالدولة تنضم للمعاهدات بإرادتها المنفردة، فيرجع تطبيقها أيضاً للإرادة المنفردة للمنظم الوطني.','ص16.');
M('t','قواعد الاختصاص القضائي الدولي توصف بأنها:',['مفردة الجانب','مزدوجة الجانب','غير ملزمة','غير وطنية'],'ص16: تقتصر على تحديد خضوع المنازعة لولاية القضاء الوطني دون تحديد اختصاص الدول الأجنبية.');
F('t','قاعدة الإسناد قاعدة مفردة الجانب لأنها تقتصر على بيان حالات تطبيق قانون القاضي.','قاعدة الإسناد مزدوجة الجانب: تبين حالات تطبيق قانون القاضي وحالات تطبيق القانون الأجنبي.','ص16، ص108.');
T('t','قواعد ثبوت الولاية للقضاء الوطني ومعايير نفي الولاية عنه قواعد ملزمة للقاضي الوطني.','ص16.');
F('t','إعطاء السلطة التقديرية لجهة الإدارة في بعض موضوعات الجنسية يعني أن قواعد الجنسية غير ملزمة.','لا يعني ذلك عدم إلزاميتها؛ فالإدارة مقيدة بعدم التعسف في استعمال السلطة التقديرية، وقواعد الجنسية ملزمة.','ص16.');
M('t','أي مما يلي ليس من خصائص قواعد القانون الدولي الخاص كما وردت في الكتاب؟',['أنها قواعد دولية موحدة بين الدول','أنها قواعد وضعية وطنية','أن منها ما هو مفرد الجانب ومنها ما هو مزدوج الجانب','أنها قواعد ملزمة'],'ص15–16.');
M('t','ما الفرق الأساسي بين القانون الدولي العام والقانون الدولي الخاص؟',['الأول يهتم بالعلاقات بين الدول، والثاني بالعلاقات بين الأفراد عبر الحدود','الأول يعتمد على التشريع الوطني، والثاني على العرف الدولي','الأول ينظم المعاهدات الدولية، والثاني ينظم الحروب','لا يوجد فرق بينهما'],'ص11 وص14: القانون الدولي الخاص ينظم العلاقات الخاصة ذات العنصر الأجنبي بين الأفراد.');X();
M('t','أي مما يلي يُعد مثالاً على نزاع يُحكم بالقانون الدولي الخاص؟',['نزاع بين شركة سعودية وشركة أجنبية حول عقد دولي','خلاف حدودي بين دولتين','اتفاقية دولية بشأن حماية البيئة','معاهدة أمنية بين دولتين'],'ص11: علاقة خاصة ذات عنصر أجنبي.');X();

/* ===== الاختصاص الدولي: النصوص والقاعدة الأصلية ===== */
T('j','لكي تثبت الولاية للقضاء السعودي في المنازعات ذات العنصر الأجنبي، ينبغي انتفاء معايير النفي وتوافر معيار من معايير الثبوت.','ص21.');
M('j','الهدف الرئيسي من قواعد الاختصاص القضائي الدولي هو:',['تحديد ولاية القضاء الوطني بالدعاوى ذات العنصر الأجنبي', 'تحديد القانون واجب التطبيق على الدعاوى ذات العنصر الأجنبي', 'توزيع القضايا بين المحاكم الداخلية نوعياً ومكانياً', 'تحديد شروط تنفيذ الأحكام الأجنبية داخل المملكة'],'ص25: تحديد ولاية القضاء المحلي (أي الوطني، وليس قواعد الاختصاص المحلي الداخلية) بنظر الدعاوى ذات العنصر الأجنبي.');
T('j','نظام المرافعات الشرعية هو النظام العام في تحديد الإجراءات أمام القضاء، وقد حدد في بابه الثاني قواعد اختصاص المحاكم السعودية.','ص25.');
F('j','المنازعات الإدارية تدخل في ولاية المحاكم العادية في المملكة.','أُخرجت المنازعات الإدارية من ولاية المحاكم العادية وعُقدت لديوان المظالم.','ص25.');
T('j','تختص محاكم المملكة بنظر الدعاوى التي ترفع على السعودي ولو لم يكن له محل إقامة عام أو مختار في المملكة.','ص26 و35 (م24 من نظام المرافعات)، فيما عدا الدعاوى العينية المتعلقة بعقار خارج المملكة.');
M('j','تختص محاكم المملكة بنظر الدعاوى التي ترفع على السعودي فيما عدا:',['الدعاوى العينية المتعلقة بعقار خارج المملكة','الدعاوى التجارية','دعاوى الأحوال الشخصية','الدعاوى المتعلقة بمال موجود خارج المملكة'],'ص26، ص37.');
F('j','لا تختص المحاكم السعودية بالدعوى المرفوعة ضد المواطن السعودي إذا كان موطنه خارج حدود السعودية.','تختص بها ولو لم يكن له محل إقامة عام أو مختار في المملكة (م24)، ما عدا الدعاوى العينية المتعلقة بعقار خارج المملكة.','ص26، ص35.');X();
T('j','تكتفي المحكمة حال قيد الدعوى بتقرير المدعي بأن المدعى عليه سعودي الجنسية.','ص26، ص35 (من اللائحة).');
M('j','كل دعوى تقام على واضع اليد على عقار ينازعه المدعي في ملكيته أو حق متصل به، كحق الانتفاع أو الارتفاق أو الوقف أو الرهن، هي:',['الدعوى العينية المتعلقة بالعقار','الدعوى الشخصية العقارية','دعوى الحيازة المنقولة','الدعوى المختلطة'],'ص26، ص37: ويشمل ذلك قسمة العقار أو دعوى الضرر منه.');
T('j','تختص محاكم المملكة بنظر الدعاوى التي ترفع على غير السعودي الذي له محل إقامة عام أو مختار في المملكة، فيما عدا الدعاوى العينية المتعلقة بعقار خارج المملكة.','ص26، ص40 (م25).');
T('j','إذا صدر أثناء نظر القضية أمر بإبعاد المدعى عليه عن المملكة، فللدائرة تحديد المدة الكافية لإكمال نظر القضية والكتابة بذلك للجهة المختصة.','ص26، ص43.');
F('j','المنازعة الموضوعية ذات الطابع الدولي تشمل التدابير التحفظية والوقتية.','يخرج من نطاقها التدابير التحفظية والوقتية؛ فالمنازعة الموضوعية محلها طلب الحكم بطلب موضوعي.','ص34.');
M('j','أي مما يلي لا يُعد عنصراً أجنبياً يجعل المنازعة ذات طابع دولي؟',['عقد بين سعوديين داخل المملكة على مال فيها', 'الجنسية الأجنبية لأحد أطراف النزاع', 'إبرام العقد في دولة أجنبية', 'تواجد المال محل العقد في دولة أجنبية'],'ص34: العنصر الأجنبي قد يتعلق بالجنسية أو التوطن خارج المملكة أو إبرام العقد في دولة أجنبية أو تواجد المال فيها.');
F('j','دعاوى إلغاء القرارات الإدارية الأجنبية تدخل في ولاية ديوان المظالم باعتبارها منازعات ذات طابع دولي.','يجب أن يكون محل المنازعة مسألة من مسائل القانون الخاص؛ ودعوى الإلغاء أمام ديوان المظالم يشترط فيها أن يكون القرار صادراً عن جهة إدارية سعودية.','ص34.');
M('j','القاعدة الأصلية في ثبوت الولاية للقضاء السعودي بالفصل في المنازعات الموضوعية ذات الطابع الدولي هي:',['أن يكون المدعى عليه سعودي الجنسية','أن يكون المدعي سعودي الجنسية','أن يكون موضوع الدعوى في المملكة','أن يتفق الطرفان على القضاء السعودي'],'ص35.');
M('j','متى تختص محاكم المملكة بالدعوى؟',['إذا كانت جنسية المدعى عليه سعودية','إذا كان التنفيذ يقع خارج السعودية','إذا كان المبلغ المتفق عليه بالعملة السعودية','إذا كان المدعي يحمل جنسية أجنبية'],'ص35: القاعدة الأصلية جنسية المدعى عليه السعودية. (ويثبت الاختصاص أيضاً باتفاق الطرفين: م28.)');
T('j','تثبت الولاية للقضاء السعودي إذا كان المدعى عليه سعودياً بغض النظر عن جنسية المدعي، سعودياً كان أو أجنبياً.','ص35: بشرط وجود عنصر أجنبي، وألا يتوافر ضابط من ضوابط نفي الولاية.');
F('j','المرجع في تحديد متى يُعد المدعى عليه سعودي الجنسية هو قانون جنسية المدعي.','المرجع هو النظام السعودي، فيُرجع إلى نظام الجنسية العربية السعودية، وللشخص الاعتباري نظام الشركات.','ص36.');
T('j','يثبت لقضاء المملكة ولاية النظر في جميع الدعاوى المقامة على السعودي، شخصاً طبيعياً أو اعتبارياً، سواء تعلقت بوجوده أو بنشاطه أو بأمواله أو بإدارته.','ص36.');
M('j','لإعمال الاستثناء على القاعدة الأصلية (العقار خارج المملكة) يُشترط:',['وجود العقار خارج المملكة وأن يكون موضوعها حقاً عينياً عليه', 'وجود العقار خارج المملكة وأن يكون المدعى عليه أجنبياً', 'أن تكون قيمة العقار كبيرة وأن يكون مسجلاً في الخارج', 'أن يكون العقار مملوكاً لدولة أجنبية أو لشركة أجنبية'],'ص37.');
F('j','دعوى المستأجر بإلزام المؤجر السعودي بتسليم شقة مؤجرة في مصر لا تختص بها المحاكم السعودية لأنها متعلقة بعقار خارج المملكة.','تختص بها المحاكم السعودية متى كان المدعى عليه سعودياً؛ لأن موضوعها حق شخصي، والاستثناء قاصر على الدعاوى العينية.','ص37.');
M('j','أي الدعاوى التالية تختص بها المحاكم السعودية رغم تعلقها بعقار خارج المملكة، متى كان المدعى عليه سعودياً؟',['دعوى التعويض عن إتلاف العقار','دعوى استحقاق العقار','دعوى قسمة العقار','دعوى تعيين حدود العقار'],'ص37: التعويض عن إتلاف عقار موضوعه حق شخصي. أما الاستحقاق والقسمة وتعيين الحدود فدعاوى عينية تخرج من ولاية القضاء السعودي.');
T('j','دعوى المقاول بطلب نفقات إصلاحات أجراها في عقار تختص بها المحاكم السعودية متى كان المدعى عليه سعودياً ولو كان العقار خارج المملكة.','ص37: موضوعها حق شخصي.');
M('j','العلة من استثناء الدعاوى العينية العقارية المتعلقة بعقار خارج المملكة من ولاية القضاء السعودي:',['أن العقارات خارج المملكة ثروة قومية تخص سيادة دولتها', 'أن المدعى عليه في هذه الدعاوى أجنبي في الغالب', 'صعوبة تبليغ المدعى عليه المقيم خارج المملكة', 'أن هذه الدعاوى من مسائل القانون العام لا الخاص'],'ص38.');
T('j','حكمت المحكمة العامة بجدة بعدم اختصاص المحاكم بالدعاوى العينية المتعلقة بعقار خارج المملكة، وتأيد الحكم من محكمة الاستئناف.','ص38.');
M('j','القاعدة الأصلية في ثبوت الولاية للقضاء السعودي بالنسبة للأجانب هي:',['أن يكون للأجنبي محل إقامة عام أو مختار في المملكة','أن يكون الأجنبي مسلماً','أن يكون المدعي سعودياً','أن يكون موضوع الدعوى مالاً في المملكة'],'ص40 (م25).');
M('j','من علل تقرير قاعدة «محل الإقامة العام أو المختار» بالنسبة للأجانب:',['أن على المدعي أن يسعى إلى مكان إقامة المدعى عليه', 'أن الأجنبي المقيم يتمتع بالحصانة القضائية', 'أن القانون السعودي هو الأصلح للأجنبي دائماً', 'حماية المدعي الأجنبي من تكاليف التقاضي'],'ص40: والعلة الثانية: أن المقيم بالمملكة له في الغالب مال يمكن التنفيذ عليه.');
F('j','المرجع في تحديد متى يُعد للأجنبي محل إقامة عام في المملكة هو قانون جنسية الأجنبي.','المرجع هو النظام السعودي، باعتباره القانون الذي يقرر القاعدة.','ص41.');
T('j','تُعد المملكة محل إقامة عام للمدعى عليه إذا كانت المكان الذي يقطنه على وجه الاعتياد.','ص41.');
M('j','بالنسبة إلى البدو الرحّل، يُعد مكان إقامة الشخص:',['المكان الذي يقطنه عند إقامة الدعوى', 'آخر مكان أقام فيه قبل سنة', 'المكان الذي ولد فيه أول مرة', 'المكان الذي تقيم فيه قبيلته'],'ص41: وبالنسبة للموقوفين والسجناء: المكان الموقوف أو المسجون فيه.');
F('j','السائح المقيم بفندق لمدة وجيزة في المملكة تُعد المملكة محل إقامة عام له.','لا تعد كذلك؛ فمحل الإقامة العام يتطلب الإقامة على وجه الاعتياد مع نية الدوام.','ص41.');
T('j','الأجنبي الذي يعمل في المملكة ويسافر إلى بلده في إجازاته لا تخل فترات غيابه بتوافر نية الإقامة.','ص41.');
M('j','ركنا محل الإقامة العام للأجنبي في المملكة هما:',['الإقامة الفعلية المستمرة ونية الإقامة الدائمة', 'الجنسية السعودية والإقامة النظامية', 'الإقامة النظامية والعمل داخل المملكة', 'التأشيرة النظامية وجواز السفر الساري'],'ص41–42.');
F('j','يرى المؤلفان أنه يكفي لتوافر محل الإقامة العام في المملكة توافر الركن المادي فقط.','يشترط المؤلفان الركنين معاً (المادي والمعنوي). ومن يكتفي بالركن المادي هو د. أحمد عبدالكريم سلامة.','ص41 (الهامش).');
T('j','يُعرّف الركن المادي لمحل الإقامة بأنه الإقامة الفعلية المستمرة التي تثبت برخصة الإقامة، فلا تكفي الإقامة المؤقتة أو العارضة كإقامة الحجاج.','ص42.');
M('j','من أمثلة محل الإقامة المختار للأجنبي في المملكة:',['مكتب المحامي الذي يختاره لاستلام التبليغات', 'الفندق الذي يقيم فيه أثناء زيارته السياحية', 'المكان الذي ولد فيه في دولته الأصلية', 'مقر سفارة دولته داخل المملكة'],'ص42.');
F('j','يشترط في محل الإقامة المختار للأجنبي توافر الركنين المادي والمعنوي.','لا يشترط فيه الركنان، لكن لا تُعد المملكة محل إقامة مختار له إلا بالنسبة للأعمال القانونية التي حددها فقط.','ص42.');
T('j','إذا حدد الأجنبي مكتب محامٍ في المملكة لنظر دعوى تعويض معينة، فلا تُعد المملكة محل إقامة مختار له إلا بالنسبة لهذه الدعوى.','ص42.');
M('j','تبليغ غير السعودي الموجود في المملكة وليس له مكان إقامة معروف أو مختار يكون عن طريق:',['وزارة الداخلية بالطرق الإدارية', 'وزارة الخارجية بالطرق الدبلوماسية', 'سفارة دولته داخل المملكة', 'النشر في الجريدة الرسمية'],'ص42 (الفقرة ط من المادة 17 من نظام المرافعات).');
T('j','تُعد المملكة موطناً عاماً للشخص الاعتباري إذا كان مقره الرئيسي (مركز إدارته الرئيسي) كائناً بالمملكة.','ص43.');
M('j','تختص محاكم المملكة بالدعوى المرفوعة على أكثر من مدعى عليه، ليس لبعضهم مكان إقامة في المملكة، إذا:',['كان لأحدهم مكان إقامة في المملكة','كان أحدهم سعودياً مقيماً خارجها','اتفق المدعى عليهم على ذلك','كان المدعي سعودياً'],'ص43 (م26/ج).');
M('j','متى تختص محاكم المملكة إذا كانت الدعوى على عدة أشخاص؟',['إذا كان لأحدهم مكان إقامة في المملكة','إذا لم يكن لأي منهم إقامة في المملكة','إذا كان جميعهم خارج المملكة','إذا كانوا من نفس الجنسية'],'ص43.');X();
F('j','لإعمال معيار تعدد المدعى عليهم يكفي وجود أكثر من مدعى عليه، ولو اختلفت الطلبات الموجهة إليهم في السبب والموضوع.','يشترط أن تتحد الطلبات الموجهة إلى المدعى عليهم في السبب والموضوع، وأن تكون دعوى واحدة، وأن يكون لأحدهم مكان إقامة في المملكة.','ص43.');
T('j','من نتائج وصف قاعدة محل الإقامة بأنها القاعدة الأصلية: أنه لا يجوز للمحاكم السعودية الاستناد إلى غيرها من القواعد إلا حيث تتخلف شروط إعمالها.','ص44.');
F('j','قاعدة محل الإقامة العام أو المختار لا تُعمل إلا في الدعاوى التجارية.','هي مطلقة في إعمالها: لا تتوقف على نوع الدعوى (مدنية أو تجارية) ولا موضوعها، بشرط ألا تدخل في مجال القانون العام.','ص44.');
M('j','دعوى إثبات النسب تُعد مثالاً على الدعوى:',['التقريرية','الإنشائية','العينية','التبعية'],'ص44: التقريرية محلها طلب تقرير حق ثابت. ومثال الإنشائية: دعوى التعويض عن المسؤولية التقصيرية.');
T('j','لا يُشترط لإعمال قاعدة محل الإقامة أن يتصل النزاع بالمملكة بطريق آخر غير إقامة المدعى عليه فيها.','ص44.');
M('j','أجنبي له محل إقامة عام في المملكة، رُفعت عليه دعوى عينية عقارية تتعلق بعقار كائن خارج المملكة. الحكم:',['لا تختص المحاكم السعودية لتوافر معيار نفي', 'تختص المحاكم السعودية لأن له محل إقامة فيها', 'تختص المحاكم السعودية إذا كان المدعي سعودياً', 'تختص المحاكم السعودية إذا وافق المدعى عليه'],'ص45.');

/* ===== المعايير الاحتياطية ===== */
T('h','لا يُلجأ إلى المعايير الاحتياطية إلا إذا انتفت شروط القاعدة الأصلية، بشرط عدم وجود معيار من معايير نفي الولاية.','ص46.');
M('h','تختص محاكم المملكة بنظر الدعاوى التي ترفع على غير السعودي الذي ليس له مكان إقامة عام أو مختار في المملكة إذا كانت الدعوى متعلقة بـ:',['مال موجود في المملكة أو التزام نشأ أو نُفذ فيها', 'مال مملوك لسعودي ولو كان موجوداً خارج المملكة', 'عقد مكتوب باللغة العربية بين طرفين أجنبيين', 'نزاع بين أجنبيين على مال موجود في الخارج'],'ص46 (م26/أ).');
M('h','متى تختص محاكم المملكة إذا كانت الدعوى متعلقة بمال؟',['إذا كان المال موجوداً في المملكة','إذا كان المال خارج المملكة','إذا كان المال منقولاً فقط','إذا كان المال مملوكاً لسعودي'],'ص46–47.');X();
M('h','متى يكون الاختصاص للمحاكم السعودية في الدعاوى العقارية؟',['إذا كان العقار داخل المملكة','إذا كان العقار مملوكاً لسعودي','إذا كان العقار باهظ الثمن','إذا كان العقار مملوكاً لأجنبي'],'ص47–49: معيار المال الموجود في المملكة، والعقار في المملكة من الاختصاص القاصر.');X();
T('h','المال هو كل عين أو منفعة أو حق له قيمة مادية في التعامل.','ص47 (وثيقة الكويت للقانون المدني).');
F('h','المقصود بالمنقول في عبارة «مال موجود في المملكة» هو المنقول المادي والمعنوي معاً.','المقصود المنقول المادي دون المعنوي.','ص47.');
F('h','يرى المؤلفان أن معيار «المال الموجود في المملكة» يشمل الدعاوى الشخصية كدعوى المؤجر بالمطالبة بالأجرة.','يرى المؤلفان أنه يقتصر على الدعاوى العينية (تقرير حق عيني أو حمايته أو حماية حيازته أو نفيه)، أما الدعاوى الشخصية فقد تدخل في معيار الالتزام.','ص47–48.');
M('h','أي الدعاوى التالية يدخل في مجال معيار «المال الموجود في المملكة» عند المؤلفين؟',['دعوى استرداد منقول موجود في المملكة','دعوى المؤجر بالمطالبة بالأجرة','دعوى التعويض عن إتلاف منقول','دعوى ناشئة عن التأمين على عقار'],'ص48: يدخل فيه الاستحقاق والاسترداد وتقرير الحقوق العينية ونفيها والقسمة وتعيين الحدود وتسلم المبيع ودعاوى الحيازة.');
M('h','من الحقوق العينية التبعية:',['حق الرهن','حق الملكية','حق الانتفاع','حق الارتفاق'],'ص48: التبعية تكون على مال معين توثيقاً لدين، وهي الرهن وحقوق الامتياز. والأصلية: الملكية والانتفاع والاستعمال والارتفاق.');
T('h','الحقوق العينية الأصلية محددة على سبيل الحصر.','ص48.');
T('h','الحق الشخصي هو مطلب يقرره القانون لشخص على آخر في عمل أو امتناع عن عمل، ويسمى التزاماً إذا نُظر إليه من جهة الدائن.','ص48 (ويسمى ديناً إذا نُظر إليه من جهة المدين).');
M('h','من علل اختصاص محاكم المملكة بالدعاوى المتعلقة بمال موجود فيها:',['تسهيل معاينة المال وتنفيذ الحكم بشأنه', 'أن صاحب المال سعودي في جميع الأحوال', 'أن المال لا يخضع لأي قانون أجنبي', 'حماية المدعي الأجنبي من مشقة التقاضي'],'ص49: فضلاً عن أن العقارات على أرض المملكة ثروة قومية وتخص السيادة.');
T('h','اختصاص القضاء السعودي فيما يخص العقارات الكائنة على أرض المملكة اختصاص قاصر عليه.','ص49: فالحكم الأجنبي الصادر في دعوى عينية عقارية تخص عقاراً على أرض المملكة غير قابل للتنفيذ فيها.');
F('h','معيار تعلق الدعوى بمال موجود في المملكة معيار أصلي يُعمل به ولو توافرت شروط المعيار الأصلي.','هو معيار احتياطي لا يُعمل إلا حيث تتخلف شروط إعمال المعيار الأصلي.','ص49.');
M('h','متى تختص محاكم المملكة بنزاع متعلق بالتزام؟',['إذا كانت المملكة مكان نشوء الالتزام أو تنفيذه','إذا نشأ الالتزام خارج المملكة فقط','إذا كان تنفيذ الالتزام خارج المملكة','إذا كان الالتزام مكتوباً'],'ص49 (م26/أ).');X();
T('h','إذا كان تنفيذ الالتزام في السعودية فإن المحاكم السعودية هي صاحبة [الاختصاص] القضائي في نظر الدعوى.','ص49–50 (م26/أ): تختص إذا كانت الدعوى متعلقة بالتزام تعد المملكة مكان نشوئه أو تنفيذه.');X();
T('h','وثيقة الكويت للنظام المدني الموحد لدول مجلس التعاون قانون استرشادي يُعمل بأحكامه في المملكة فيما لا يخالف نصاً نظامياً أو لائحياً نافذاً.','ص50.');
T('h','تُعد المملكة مكان نشوء الالتزام إذا كان قد أُبرم داخلها، سواء أكان من طرفين أم من طرف واحد كالجعالة.','ص50 (اللائحة).');
F('h','لا تُعد المملكة مكان نشوء الالتزام إذا كان الالتزام بدون إرادة كضمان المتلف.','تعد كذلك سواء أكان الالتزام بإرادة كالبيع أم بدون إرادة كضمان المتلف.','ص50.');
T('h','تُعد المملكة مكان تنفيذ الالتزام إذا تم الاتفاق في العقد على تنفيذه فيها كلياً أو جزئياً، ولو كان مكان إنشائه خارج المملكة.','ص50 (اللائحة).');
M('h','إذا كان المتعاقدان في مكانين مختلفين وتعاقدا بالكتابة أو عن بُعد، فمكان العقد هو:',['مكان القابل ما لم يُتفق على غيره', 'مكان الموجب ما لم يُتفق على غيره', 'مكان تنفيذ العقد في جميع الأحوال', 'مكان المحكمة التي تنظر النزاع'],'ص51 (وثيقة الكويت). وإذا كانا في مكان واحد فمكان العقد مكان العاقدين.');
M('h','عناصر المسؤولية التقصيرية:',['الخطأ والضرر وعلاقة السببية','العقد والإخلال والتعويض','الإيجاب والقبول والمحل','الضرر والتعويض فقط'],'ص51: الخطأ هو الخروج عن السلوك المألوف.');
T('h','إذا افترقت عناصر المسؤولية التقصيرية بين بلدين، فإن الالتزام ينشأ في المملكة إذا تحقق الضرر في المملكة.','ص51.');
F('h','في الإثراء بلا سبب، العبرة في نشوء الالتزام في المملكة بأن تكون المملكة مكان واقعة الافتقار.','العبرة بأن تكون المملكة مكان نشأة واقعة الإثراء، باعتبارها الواقعة الموجبة للمسؤولية.','ص51.');
M('h','متى تختص محاكم المملكة في مسائل الإفلاس؟',['إذا أُشهر الإفلاس في المملكة','إذا أُشهر الإفلاس خارج المملكة','إذا كان المدين سعودياً','إذا كان الدين تجارياً فقط'],'ص51 (م26/ب).');X();
T('h','تختص المحاكم السعودية باي قضيه افلاس اذا تم شهر الإفلاس من قبل أحد المحاكم السعودية.','ص51–52: تختص بالدعاوى المتعلقة بإفلاس أُشهر في المملكة (م26/ب).');X();
F('h','دعوى شهر الإفلاس نفسها لها معيار خاص بها لعقد الولاية للقضاء السعودي.','دعوى شهر الإفلاس نفسها ليس لها معيار خاص، وإنما تنعقد الولاية بنظرها وفقاً للقواعد العامة.','ص52.');
T('h','يتحدد الاختصاص المكاني في طلبات الإفلاس للمحكمة التي يقع في نطاقها المقر الرئيس لممارسة نشاط المدين.','ص52.');
M('h','المعايير الاحتياطية المتعلقة بدعاوى الأحوال الشخصية تخص الدعاوى المقامة على:',['المسلم غير السعودي الذي ليس له مكان إقامة في المملكة', 'أي أجنبي له مكان إقامة عام أو مختار في المملكة', 'السعودي الذي ليس له مكان إقامة في المملكة', 'غير المسلم الذي ليس له مكان إقامة في المملكة'],'ص53 (م27).');
M('h','دعوى المعارضة في عقد زواج يراد إبرامه في المملكة هي الدعوى التي يكون المقصود منها:',['وقف توثيق عقد الزواج لتخلف بعض شروطه الموضوعية', 'فسخ عقد زواج قائم لتخلف بعض شروطه الشكلية', 'إثبات عقد زواج غير موثق أمام الجهة المختصة', 'المطالبة بالآثار المالية المترتبة على عقد الزواج'],'ص55.');
F('h','إذا كان المسلم غير السعودي مقيماً في المملكة، فإن الولاية في دعوى المعارضة في عقد زواج تنعقد استناداً لمعيار المعارضة الاحتياطي.','تنعقد استناداً إلى القاعدة الأصلية (محل الإقامة) وليس إلى المعيار الاحتياطي.','ص55.');
M('h','تختص محاكم المملكة بدعوى الطلاق أو فسخ عقد الزواج المرفوعة على المسلم غير السعودي الذي ليس له مكان إقامة في المملكة، إذا رفعتها:',['الزوجة السعودية، أو التي فقدت جنسيتها بالزواج، المقيمة', 'أي زوجة أجنبية ولو كانت مقيمة خارج المملكة', 'الزوجة السعودية ولو كانت مقيمة خارج المملكة', 'الزوج نفسه إذا كان مقيماً خارج المملكة'],'ص55–56.');
T('h','تختص محاكم المملكة بدعوى الزوجة غير السعودية المقيمة في المملكة على زوجها الذي كان له مكان إقامة فيها، متى هجرها وجعل مكان إقامته في الخارج أو أُبعد من أراضي المملكة.','ص55–56.');
M('h','تختص المحاكم السعودية بنظر الدعوى المقامة ضد الاجنبي ولو أقام خارج السعودية في حالة :',['كان الاجنبي مسلما و الدعوى بطلب طلاق','كان الاجنبي سبق و أن اقام داخل السعودية بغض النظر عن ديانته','كان الاجنبي مسلما وله اطفال يقيمون داخل السعودية','كان الاجنبي متزوج من مواطنة سعوديه بغض النظر عن ديانته'],'ص53–56 (م27): المعايير الاحتياطية للأحوال الشخصية تخص المسلم غير السعودي، ومنها دعوى الطلاق أو الفسخ المرفوعة من الزوجة السعودية المقيمة في المملكة. ولاحظ إن الديانة شرط، فالخياران اللي فيهم «بغض النظر عن ديانته» غلط.');X();
T('h','الدعاوى التي ترتب بعض آثار الطلاق أو الفسخ، كنفقة العدة، تدخل في معيار إقامة الزوجة طالبة الطلاق متى توافرت ضوابطه.','ص56.');
M('h','العلة من تقرير معيار إقامة الزوجة طالبة الطلاق أو الفسخ في المملكة:',['رابطة الجنسية الحالية أو السابقة ورابطة الإقامة وتيسيراً على الزوجة', 'أن الزوج المدعى عليه أجنبي ولا يقيم في المملكة', 'أن الطلاق والفسخ من مسائل القانون العام في المملكة', 'أن عقد الزواج أُبرم داخل المملكة في الغالب'],'ص57.');
M('h','متى تختص محاكم المملكة في دعوى النفقة؟',['إذا كان طالب النفقة مقيماً في المملكة','إذا كان الزوج سعودياً','إذا كانت النفقة مؤقتة','إذا كان الزوج خارج المملكة'],'ص57 (م27/ج): على المسلم غير السعودي الذي ليس له مكان إقامة في المملكة.');X();
T('h','طالب النفقة هو الطرف الأولى بالرعاية في العلاقة التي يُفترض فيها امتناع الموجب عليه النفقة عن أدائها رضاءً.','ص57.');
F('h','معيار «إقامة الصغير المطالب بإثبات نسبه في المملكة» يشمل دعاوى إنكار النسب.','يرى المؤلفان أنه ينطبق على الدعاوى التي يقيمها الصغير ويطلب فيها إثبات النسب، أما دعاوى إنكار النسب فلا تدخل فيه.','ص58.');
M('h','من أمثلة دعاوى الولاية على النفس:',['طلب تعيين وصي على قاصر أو قيّم على محجور', 'طلب الإذن للنائب في أعمال التصرف في المال', 'دعوى نفقة الأقارب المقامة من القاصر', 'دعوى قسمة التركة بين الورثة القصر'],'ص59: ومثال الولاية على المال: طلب الإذن للنائب فيما يلزم فيه الإذن من أعمال التصرف أو الإدارة.');
T('h','تختص محاكم المملكة بدعاوى الولاية على النفس أو المال المقامة على المسلم غير السعودي الذي ليس له مكان إقامة في المملكة، متى كان للقاصر أو المطلوب الحجر عليه مكان إقامة في المملكة.','ص59 (م27/د).');
M('h','لإعمال معيار «دعاوى الأحوال الشخصية الأخرى» يجب أن يكون المدعي:',['سعودياً أو غير سعودي مقيم، ولا إقامة معروفة للمدعى عليه بالخارج', 'سعودياً مقيماً خارج المملكة، وللمدعى عليه إقامة معروفة بالخارج', 'أجنبياً غير مقيم في المملكة، ولو كان للمدعى عليه إقامة بالخارج', 'من نفس جنسية المدعى عليه، أياً كان مكان إقامة كل منهما'],'ص60 (م27/هـ).');
F('h','يقر المؤلفان رأي بعض الفقه بأن المنظم السعودي لم ينص على معيار لعقد الاختصاص بدعاوى الإرث والتركات.','لا يقران هذا الرأي؛ فدعاوى الإرث والتركات تدخل في معيار «دعاوى الأحوال الشخصية الأخرى» إذا تخلفت ضوابط المعيار الأصلي والمعايير الاحتياطية الأخرى.','ص61.');
M('h','تختص محاكم المملكة بدعاوى الإرث والتركات في الأحوال التالية ما عدا:',['إذا كان أحد الورثة يقيم خارج المملكة','إذا كان المورث سعودي الجنسية','إذا كانت أعيان التركة أو بعضها كائنة بالمملكة','إذا توافرت ضوابط معيار دعاوى الأحوال الشخصية الأخرى'],'ص61: وحالة المورث السعودي تقوم على افتراض امتداد شخصية المورث لحين تصفية التركة.');
T('h','إذا كان المدعى عليه غير السعودي ممنوعاً من دخول المملكة، فله التوكيل حسب الأنظمة والتعليمات.','ص53 (اللائحة).');
M('h','من المعايير الاحتياطية التي لا يتقيد إعمالها بموضوع محدد للدعوى:',['قبول المتداعيين لولاية القضاء السعودي','المال الموجود في المملكة','الإفلاس المشهر في المملكة','إقامة طالب النفقة في المملكة'],'ص62: والمعيار الثاني: قيام صلة ارتباط بين دعويين أو دعاوى متعددة.');
T('h','فيما عدا الدعاوى العينية المتعلقة بعقار خارج المملكة، تختص محاكم المملكة بنظر الدعوى إذا قبل المتداعيان ولايتها ولو لم تكن داخلة في اختصاصها.','ص62 (م28).');
F('h','يجوز أن يكون قبول المتداعيين لولاية القضاء السعودي عن نزاع قائم فقط، ولا يجوز عن نزاع قد ينشأ مستقبلاً.','يجوز عن النزاع الذي نشأ أو الذي قد ينشأ مستقبلاً، باتفاق سابق (مستقل أو بند في عقد) أو لاحق على قيام النزاع.','ص63.');
M('h','إذا حضر المدعى عليه أمام القضاء السعودي ولم يدفع بعدم الاختصاص وتكلم في موضوع الدعوى، فإن ذلك يُعد:',['قبولاً ضمنياً لولاية القضاء السعودي','قبولاً صريحاً','رفضاً لولاية القضاء السعودي','لا أثر له'],'ص63–64: أما إذا صرّح كتابة أو شفاهة مع إثباته في محضر الجلسة فهو قبول صريح.');
F('h','غياب المدعى عليه عن الحضور أمام القضاء السعودي يُعد قبولاً ضمنياً منه لولايته.','لا يعد غياب المدعى عليه قبولاً ضمنياً.','ص64.');
T('h','يشترط لنظر الدعوى بناءً على قبول المتداعيين أن تكون المحكمة مختصة بها نوعاً.','ص62، ص64 (اللائحة).');
F('h','تعتبر المحاكم السعودية هي الجهات المختصة بنظر الدعوى المتعلقة بالعقار خارج المملكة طالما ان اطراف النزاع عبروا صراحة عن رغبتهم في التحاكم للقضاء السعودي.','لا تختص؛ فالدعاوى العينية المتعلقة بعقار خارج المملكة مستثناة من معيار قبول المتداعيين (م28).','ص64.');X();
T('h','اختصاص محاكم المملكة يستتبع الاختصاص بنظر المسائل الأولية والطلبات العارضة على الدعوى الأصلية، وكل طلب يرتبط بها ويقتضي حسن سير العدالة أن يُنظر معها.','ص64 (م30).');
M('h','المسائل الأولية هي الأمور التي يتوقف الفصل في الدعوى على البت فيها، ومن أمثلتها:',['الاختصاص والأهلية والصفة وحصر الورثة', 'الطلبات العارضة والطلبات المرتبطة', 'التدابير التحفظية والتدابير الوقتية', 'تنفيذ الحكم والاعتراض عليه'],'ص65 (اللائحة).');
F('h','يرى المؤلفان أن عبارة «كل طلب يرتبط بهذه الدعوى ويقتضي حسن سير العدالة أن ينظر معها» يُقصد بها المسائل الأولية والطلبات العارضة.','يرون أن المقصود طلبان أصليان مرتبطان (ليس مسألة أولية ولا طلباً عارضاً)، بالاتحاد في الموضوع أو في السبب؛ وإلا كان ذلك تزيداً من المنظم.','ص65–66.');
M('h','طلب المدعي ملكية عقار بناءً على الميراث، وطلبه ملكية نفس العقار بناءً على حيازته المدة المكسبة للملكية، مثال على الارتباط:',['بالاتحاد في عنصر الموضوع','بالاتحاد في عنصر السبب','بالاتحاد في الأطراف','لا يوجد ارتباط'],'ص65–66: ومثال الاتحاد في السبب: دعوى استرداد الحيازة ودعوى تعويض الضرر من أفعال تشكل اعتداء على الحيازة.');
M('h','التقادم السباعي هو الذي تكتسب فيه ملكية العقار غير المسجل في السجل العيني بوضع اليد لمدة:',['سبع سنوات مع حسن النية','خمس عشرة سنة مع حسن النية','سبع سنوات بدون حسن النية','عشر سنوات'],'ص66 (الهامش): أما التقادم الطويل فلا يتوافر فيه حسن النية ويتطلب 15 سنة.');
T('h','تختص محاكم المملكة باتخاذ التدابير التحفظية والوقتية التي تنفذ في المملكة ولو كانت غير مختصة بالدعوى الأصلية.','ص67 (م29).');
M('h','الإجراءات التي تُتخذ من أجل حماية مال أو حق هي:',['التدابير التحفظية','التدابير الوقتية','المسائل الأولية','الطلبات العارضة'],'ص67: أما التدابير الوقتية فهي الإجراءات التي تتخذها الدائرة في الحالات المستعجلة بصورة وقتية حتى يصدر الحكم في الدعوى الأصلية.');
F('h','يجوز اتخاذ التدابير التحفظية والوقتية في المملكة ولو كانت الدعوى الأصلية مخالفة لأحكام الشريعة الإسلامية.','يشترط ألا تكون الدعوى الأصلية مخالفة لأحكام الشريعة الإسلامية، ووجود طلب من المحكمة التي تنظر الأصلية أو من أحد طرفي النزاع بعد ثبوت قيامها.','ص67.');
T('h','تتخذ التدابير التحفظية والوقتية المحكمة المختصة بنظر الموضوع فيما لو كانت الدعوى الأصلية مقامة في المملكة.','ص67.');

/* ===== معايير نفي الولاية ===== */
T('n','الخطوة الأولى لتحديد مدى ولاية القضاء السعودي بنظر الدعوى ذات العنصر الأجنبي هي النظر في وجود معيار من معايير نفي الولاية.','ص69: فإذا توافر حُكم بعدم الاختصاص، وإلا بحث في معايير الثبوت.');
F('n','إذا توافر معيار من معايير ثبوت الولاية للقضاء السعودي فإنه يختص بالدعوى حتى لو توافر معيار من معايير نفي الولاية.','توافر معيار النفي يمنع اختصاص القضاء السعودي ولو توافر معيار ثبوت، أصلياً كان أو احتياطياً.','ص69.');
M('n','عدد معايير نفي الولاية عن القضاء السعودي من وجهة نظر المؤلفين:',['أربعة','اثنان','ثلاثة','خمسة'],'ص69–70: العينية العقارية خارج المملكة، الحصانة القضائية، التنفيذ الجبري والإجراءات الوقتية خارج المملكة، سلب الولاية بالاتفاق.');
M('n','أي مما يلي ليس من معايير نفي الولاية عن القضاء السعودي؟',['إقامة المدعى عليه خارج المملكة','الحصانة القضائية','الدعوى العينية العقارية المتعلقة بعقار خارج المملكة','سلب الولاية عن القضاء السعودي بالاتفاق'],'ص69–70.');
T('n','تنتفي ولاية القضاء السعودي بالدعوى العينية العقارية المتعلقة بعقار خارج المملكة، سواء تعلقت بمسائل المعاملات أو بمسائل الأحوال الشخصية كدعاوى التركات.','ص71.');
F('n','الأحكام الأجنبية الصادرة في دعوى عينية عقارية تتعلق بعقار كائن في المملكة قابلة للتنفيذ فيها متى توافرت شروط التنفيذ.','تدخل ضمن الاختصاص القاصر للمملكة، والأحكام الأجنبية بشأنها غير قابلة للتنفيذ داخل المملكة.','ص71.');
T('n','تنتفي ولاية القضاء السعودي متى كانت الدعوى مقامة على دولة أجنبية ذات سيادة، وكانت مقامة عليها بصفتها سلطة عامة.','ص73.');
F('n','يرى المؤلفان إعمال معيار الحصانة القضائية حتى لو كانت المملكة لا تعترف بالدولة المدعى عليها.','يرى المؤلفان أن معيار نفي الولاية لا يُعمل إذا كانت المملكة لا تعترف بالدولة المدعى عليها.','ص73.');
M('n','حكم القضاء الفرنسي لجمهورية فيتنام الشمالية بالحصانة رغم عدم اعتراف فرنسا بها رسمياً، استناداً إلى:',['قيام علاقات وثيقة تبرر القول بالاعتراف الواقعي', 'وجود معاهدة صداقة رسمية بين الدولتين', 'أن الدعوى المقامة كانت دعوى تجارية', 'قواعد المجاملة الدولية بين الدول'],'ص73.');
F('n','إذا مارست الدولة الأجنبية نشاطاً تجارياً، فإنها تتمتع بالحصانة القضائية وتنتفي ولاية القضاء السعودي.','يرى المؤلفان عدم إعمال معيار الحصانة في النشاط التجاري؛ فيختص القضاء السعودي إذا ثبتت له الولاية بمعيار من معايير الثبوت.','ص73–74.');
T('n','قيام دولة أجنبية بمصادرة أموال شخص لا يختص القضاء السعودي بنظر دعوى التعويض عنه ولو توافر معيار من معايير ثبوت الولاية له.','ص73: لأنها تصرفت بصفتها سلطة عامة.');
M('n','إذا رغبت المملكة في مباشرة الدعوى بالنسبة لمواطنيها ضد دولة أجنبية، فعليها مباشرتها:',['وفق قواعد الحماية الدولية أمام محكمة العدل الدولية', 'أمام المحاكم السعودية وفق نظام المرافعات الشرعية', 'أمام محاكم الدولة الأجنبية وفق قانونها الداخلي', 'أمام ديوان المظالم باعتبارها منازعة إدارية'],'ص74.');
M('n','يتأسس معيار الحصانة القضائية في رأي المؤلفين على:',['اعتبارات السيادة','قواعد المجاملة الدولية','مبدأ المعاملة بالمثل','قواعد الاختصاص الداخلي'],'ص74: (ويرى د. عنايت عكس ذلك).');
T('n','وفقاً لاتفاقية الرياض العربية، يجوز رفض تنفيذ الإنابة القضائية إذا كان من شأن التنفيذ المساس بسيادة الطرف المطلوب إليه أو بالنظام العام فيه.','ص74.');
F('n','تسري أحكام الاعتراف وتنفيذ الأحكام في اتفاقية الرياض على الإجراءات الوقتية والتحفظية وأحكام الإفلاس والضرائب.','لا تسري على الإجراءات الوقتية والتحفظية، ولا الأحكام الصادرة في قضايا الإفلاس والضرائب والرسوم، ولا الأحكام ضد حكومة الطرف المطلوب إليه أو موظفيها عن أعمال الوظيفة.','ص75، ص78.');
T('n','يقصد بالحكم في اتفاقية الرياض كل قرار، أياً كانت تسميته، يصدر بناءً على إجراءات قضائية أو ولائية.','ص74.');
T('n','بمفهوم المخالفة للمادة 29 من نظام المرافعات، تنتفي ولاية القضاء السعودي بنظر إجراءات التنفيذ الجبري والإجراءات الوقتية المراد اتخاذها خارج المملكة.','ص77.');
F('n','نظّم المنظم السعودي صراحة مسألة سلب الولاية عن القضاء السعودي بالاتفاق.','لم يتعرض المنظم السعودي للفرض العكسي (سلب الولاية بالاتفاق)، وإنما نظّم قبول الولاية فقط.','ص79.');
M('n','أي مما يلي ليس من حالات الاختصاص القاصر للقضاء السعودي؟',['الدعوى المتعلقة بالتزام نشأ في المملكة','الدعوى العينية العقارية المتعلقة بعقار كائن بالمملكة','الاتفاق على عقد ولاية الفصل في النزاع للقضاء السعودي دون غيره','الدعوى المقامة على المملكة أمام محكمة دولة أجنبية'],'ص79–80. ومنها أيضاً: الإجراءات الوقتية والتنفيذ الجبري.');
T('n','في غير حالات الاختصاص القاصر (الاختصاص المشترك)، تملك الإرادة سلب الاختصاص من ولاية القضاء السعودي.','ص80.');
M('n','لا يُعتد بالاتفاق على سلب الولاية عن القضاء السعودي إذا:',['انطوى على غش نحو القانون أو ورد في عقد إذعان', 'كان مكتوباً في بند مستقل عن العقد الأصلي', 'كان لاحقاً على قيام النزاع بين الطرفين', 'كان أحد طرفيه أجنبياً مقيماً خارج المملكة'],'ص80: إعمالاً لقاعدة «الغش يفسد كل شيء»، ولأن عقد الإذعان يفرض فيه الطرف القوي إرادته على الأضعف.');
F('n','الاتفاق على سلب الولاية الوارد في عقد إذعان يُعتد به لأنه صادر عن إرادة الطرفين.','لا يعتد به؛ لأن الطرف القوي في عقد الإذعان يفرض إرادته على الطرف الأضعف.','ص80.');

/* ===== تنفيذ الأحكام الأجنبية ===== */
T('e','تكمن مشكلة تنفيذ الأحكام الأجنبية في انفصال سلطة القضاء عن سلطة التنفيذ؛ فالحكم يصدر باسم سيادة دولة، وسلطة التنفيذ تعمل باسم سيادة دولة أخرى.','ص83.');
T('e','سلب القوة التنفيذية للحكم الأجنبي يشكل عقبة في نمو علاقات الأفراد عبر الحدود.','ص83: فكل مدين يمكنه التنصل من التزاماته بالخروج من الدولة التي صدر فيها الحكم ضده.');
F('e','التزام الدول بتنفيذ الأحكام الأجنبية التزام مطلق دون قيد أو شرط.','التزامها لا يعني أن تقرر ذلك بصفة مطلقة دون قيد أو شرط.','ص83.');
M('e','الدول التي لا تعترف للحكم الأجنبي بأي أثر نظامي داخل إقليمها، ويلزم المحكوم له بإقامة دعوى جديدة:',['الدول الإسكندنافية','المملكة العربية السعودية','مصر','فرنسا'],'ص83–84: ولم يأخذ النظام السعودي بذلك.');
F('e','أخذ النظام السعودي بعدم الاعتراف للحكم الأجنبي بأي أثر، وألزم المحكوم له بإقامة دعوى جديدة.','لم يأخذ النظام السعودي بذلك، وإنما نظّم تنفيذ الأحكام الأجنبية بشروط في نظام التنفيذ.','ص84.');
T('e','لا يجوز التنفيذ الجبري إلا بسند تنفيذي لحق محدد المقدار حال الأداء.','ص84، ص86 (نظام التنفيذ).');
T('e','من السندات التنفيذية الواردة على سبيل الحصر: الأحكام والأوامر القضائية وأحكام المحكمين والمحررات الموثقة الصادرة في بلد أجنبي.','ص84.');
F('e','السندات التنفيذية في نظام التنفيذ واردة على سبيل المثال.','واردة على سبيل الحصر.','ص84، ص86.');
M('e','لا يجوز لقاضي التنفيذ تنفيذ الأحكام والأوامر الأجنبية إلا على أساس:',['مبدأ المعاملة بالمثل وبعد التحقق من الشروط', 'مبدأ المجاملة الدولية دون أي شرط آخر', 'موافقة وزارة الخارجية على طلب التنفيذ', 'اتفاق الأطراف على تنفيذ الحكم في المملكة'],'ص84 (م11 من نظام التنفيذ)، مع التقيد بما تقضي به المعاهدات والاتفاقيات.');
M('e','ماذا يترتب على صدور حكم أجنبي في مسائل من اختصاص المحاكم السعودية؟',['لا يتم تنفيذه داخل المملكة','يتم تنفيذه مباشرة','يتم تنفيذه بشروط','يتم تنفيذه جزئياً'],'ص84: من شروط التنفيذ أن تكون محاكم المملكة غير مختصة بالمنازعة التي صدر فيها الحكم.');X();
F('e','يجوز تنفيذ الأحكام الأجنبية في السعودية ولو خالفت النظام العام.','لا يجوز؛ يشترط ألا يتضمن الحكم أو الأمر ما يخالف أحكام النظام العام في المملكة (أي أحكام الشريعة الإسلامية).','ص85، ص96.');X();
M('e','المقصود بالنظام العام في تنفيذ الأحكام الأجنبية وفقاً للائحة التنفيذية لنظام التنفيذ:',['أحكام الشريعة الإسلامية','القواعد الآمرة في القانون المدني','الأعراف التجارية','المعاهدات الدولية'],'ص85، ص96.');
M('e','الوثائق الرسمية الصادرة من بلد أجنبي يلزم تصديقها من:',['وزارتي الخارجية والعدل','وزارة الداخلية فقط','وزارة التجارة','المجلس الأعلى للقضاء'],'ص85، ص99: وتترجم إلى العربية من مكتب ترجمة معتمد.');
T('e','عبء إثبات تحقق شرط المعاملة بالمثل يقع على طالب التنفيذ.','ص85، ص98 (اللائحة).');
F('e','يجوز تنفيذ الحكم الأجنبي في الدعاوى العينية المتعلقة بعقار داخل المملكة متى كان الحكم نهائياً.','لا يجوز تنفيذ الحكم الأجنبي في القضايا التي تنفرد محاكم المملكة باختصاصها، كالدعاوى العينية المتعلقة بعقار داخل المملكة.','ص85.');
M('e','العبرة في اعتبار الحكم أجنبياً:',['صدوره عن قضاء دولة أجنبية باسمها أياً كان مكانه', 'صدوره خارج إقليم المملكة أياً كانت الجهة', 'أن يكون أحد الخصوم فيه أجنبي الجنسية', 'أن يصدر بلغة أجنبية غير اللغة العربية'],'ص86: فالحكم الصادر من قنصلية دولة أجنبية داخل المملكة يعد حكماً أجنبياً.');
T('e','الحكم الصادر من قنصلية دولة أجنبية كائنة بإقليم الدولة الوطنية يُعد حكماً أجنبياً.','ص86: لأن السفارات والقنصليات جزء من إقليم الدولة التابعة لها.');
F('e','يتحقق القاضي السعودي من موضوع الحكم الأجنبي وما قضى به بحرية كاملة قبل الأمر بتنفيذه.','يتحقق من توافر الأوصاف المتطلبة من تلقاء نفسه، دون أن يتعرض لموضوع الحكم ذاته إلا في حدود التأكد من الأوصاف.','ص86.');
T('e','لا يجوز تنفيذ الأحكام الأجنبية إلا إذا كانت صادرة في نطاق القانون الخاص.','ص86.');
M('e','«وصف ظاهر منضبط يلزم من عدمه عدم وجود الحكم النظامي، ولا يلزم من وجوده وجود الحكم النظامي أو عدمه لذاته» هو تعريف:',['الشرط','المانع','السبب','الركن'],'ص87: أما المانع فيلزم من وجوده عدم الحكم، ولا يلزم من عدمه وجود ولا عدم.');
M('e','عدد الشروط التي اشترطها المنظم لتنفيذ الحكم الأجنبي في المملكة:',['ثلاثة','اثنان','أربعة','خمسة'],'ص89: صدوره عن قضاء ذي ولاية، وإجراءات تكفل احترام حق الدفاع، وحيازته لقوة الأمر المقضي.');
F('e','يشترط لتنفيذ الحكم الأجنبي أن تكون المحكمة الأجنبية مختصة وفقاً لقواعد الاختصاص الداخلية في دولتها من اختصاص ولائي ونوعي وقيمي.','اكتفى المنظم بأن تكون المحاكم الأجنبية مختصة وفقاً لقواعد الاختصاص القضائي الدولي المقررة في أنظمتها.','ص90.');
T('e','العبرة من اشتراط أن تكون محاكم المملكة غير مختصة بالمنازعة هي احترام سيادة القضاء السعودي وعدم الانتقاص من مجال ولايته لصالح القضاء الأجنبي.','ص89.');
F('e','يشترط لتنفيذ الحكم الأجنبي في المملكة أن يكون قد صدر حضورياً.','لا يقتضي ذلك؛ فالحكم الغيابي الأجنبي قابل للاعتراف به متى كان المحكوم عليه قد أُعلن صحيحاً ومُكّن من الطعن عليه.','ص90.');
M('e','المرجع في استظهار مدى مراعاة الإجراءات التي يقتضيها احترام حق الدفاع:',['دولة الحكم الأجنبي المراد تنفيذه','النظام السعودي','قانون جنسية المحكوم عليه','اتفاق الطرفين'],'ص90.');
T('e','يشترط في حالة الحكم الغيابي تقديم نسخة من مستند تبليغ الحكم مصدق عليها بمطابقتها لأصلها، أو أي مستند آخر يثبت إعلان المدعى عليه إعلاناً صحيحاً.','ص85، ص90.');
M('e','وصف للحكم النهائي الذي لا يقبل الاعتراض عليه بطرق الاعتراض العادية ويكون قابلاً للتنفيذ اختياراً أو جبراً:',['قوة الأمر المقضي','حجية الأمر المقضي','الحكم المستعجل','السند التنفيذي'],'ص91–92.');
F('e','الدفع بحجية الأمر المقضي لا تقضي به المحكمة إلا إذا دفع به الخصم.','هذا الدفع متعلق بالنظام العام، فتقضي به المحكمة من تلقاء نفسها ولو لم يدفع به الخصم.','ص91.');
T('e','لا تكون للأحكام حجية الأمر المقضي إلا في نزاع قام بين الخصوم أنفسهم دون أن تتغير صفاتهم، وتعلق بالحق ذاته محلاً وسبباً.','ص91 (نظام الإثبات).');
M('e','المرجع في تحديد ما إذا كان الحكم الأجنبي نهائياً:',['نظام البلد الصادر باسمه الحكم','النظام السعودي','قانون جنسية المحكوم له','وثيقة الكويت'],'ص92: وحسناً فعل المنظم بالنص صراحة على ذلك، بخلاف بعض الأنظمة كالمصري.');
F('e','يرى المؤلفان أن علة عدم جواز تنفيذ الأحكام الأجنبية المستعجلة أنها ليست أحكاماً نهائية.','يتفقان مع النتيجة (عدم التنفيذ) لكن العلة عندهما أن الإجراءات الوقتية والمستعجلة داخل المملكة من الاختصاص القاصر للمملكة، فيتوافر المانع.','ص92–93.');
T('e','استخدام المنظم حرف «الكاف» في «كالدعاوى العينية المتعلقة بعقار داخل المملكة» يدل على أن ذلك ورد على سبيل المثال.','ص93.');
M('e','المانعان اللذان يجب تخلفهما في الحكم الأجنبي المراد تنفيذه:',['التعارض مع حكم أو دعوى في المملكة، ومخالفة النظام العام', 'عدم نهائية الحكم، وعدم اختصاص المحكمة الأجنبية', 'صدور الحكم غيابياً، وعدم ترجمته إلى العربية', 'عدم المعاملة بالمثل، وعدم تصديق الحكم'],'ص94.');
T('e','علة مانع التعارض مع حكم سعودي أن تفضيل الحكم الأجنبي على السعودي يعني أن القضاء الأجنبي أقدر على أداء العدالة، وهو أمر غير مقبول في معظم الدول.','ص94.');
F('e','يشترط المؤلفان لإعمال مانع التعارض أن يكون الحكم السعودي حكماً نهائياً.','لا يشترطان ذلك، بل يكفي أن يكون حكم أول درجة.','ص95.');
M('e','معيار المقارنة في مانع «وجود دعوى قائمة في المملكة» هو:',['تاريخ قيد الدعوى','تاريخ صدور الحكم','تاريخ التقدم بطلب التنفيذ','تاريخ نشوء الحق'],'ص95: يشترط أن تكون الدعوى السعودية متحدة في عناصرها الثلاثة مع الحكم الأجنبي، وتاريخ قيدها سابق.');
T('e','يشترط لتنفيذ الحكم الأجنبي ألا تكون هناك دعوى قائمة في المملكة سابقة على الدعوى التي صدر فيها الحكم الأجنبي.','ص85، ص95 (اللائحة).');
T('e','إذا صدر الحكم السعودي أثناء نظر طلب تنفيذ الحكم الأجنبي، تعين على القاضي رفض طلب التنفيذ.','ص96: يجب أن يكون المانع متخلفاً حتى صدور الأمر بالتنفيذ.');
M('e','إذا طُلب الاعتراف في المملكة بحكمين أجنبيين متعارضين ولم ينتج عن المبدأ تفضيل بينهما، فالأولى بالتنفيذ:',['أحسنهما قضاءً','الأقدم صدوراً','الأحدث صدوراً','لا ينفذ أي منهما'],'ص96: وهو ما يتيح للقاضي مراجعة الحكمين مراجعة محدودة.');
F('e','النظام العام في القانون الدولي الخاص يشمل كل القواعد الآمرة في الدولة بما فيها ما يجوز الخروج عليه في العلاقات الدولية.','النظام العام طائفة من القواعد الآمرة التي لا تتسامح الدولة في الخروج على أحكامها حتى في نطاق العلاقات ذات الطابع الدولي.','ص96.');
F('e','مبدأ المعاملة بالمثل يشمل تحديد الإجراء الذي يتم به تقرير النفاذ للحكم الأجنبي (دعوى أو أمر على عريضة).','لا يدخل تحت مظلته؛ فتنظيم مرفق القضاء أمر يتعلق بسيادة الدولة، وإنما يتعلق المبدأ بمعاملة الحكم الأجنبي بذات معاملة أحكامنا لدى تلك الدولة.','ص97.');
M('e','إذا كانت دولة الحكم لا تعترف بالأحكام الصادرة من القضاء السعودي، فإن مبدأ المعاملة بالمثل يقتضي:',['عدم الاعتراف لأحكامها بأي أثر في المملكة', 'الاعتراف بأحكامها بشروط مخففة', 'تنفيذ أحكامها بعد موافقة وزارة العدل', 'تنفيذ أحكامها تنفيذاً جزئياً فقط'],'ص98 (الفرض الأول).');
T('e','إذا اشترطت دولة الحكم الأجنبي أوصافاً أشد من الأوصاف المتطلبة في النظام السعودي، وجب معاملة أحكامها بذات المعاملة.','ص98 (الفرض الثاني).');
F('e','إذا كانت الدولة الصادر باسمها الحكم لا تتطلب أي شرط لتنفيذ الأحكام السعودية، فإن أحكامها تنفذ في المملكة دون التحقق من الأوصاف النظامية.','لا يجوز تنفيذ الحكم الصادر عنها إلا إذا توافرت له الأوصاف المتطلبة نظاماً، لأنها الحد الأدنى.','ص98 (الفرض الثالث).');
M('e','قضى حكم أجنبي بدين وفوائده الربوية. ما الذي يُنفذ في المملكة؟',['الدين فقط دون الفوائد الربوية', 'الحكم كاملاً بالدين والفوائد', 'لا يُنفذ أي شيء من الحكم', 'الفوائد فقط دون أصل الدين'],'ص99: إذا كان الحكم قابلاً للتنفيذ في شق منه فقط أُمر بتنفيذ هذا الشق.');
T('e','إذا تحقق القاضي السعودي من توافر الأوصاف المطلوبة أمر بتنفيذ الحكم الأجنبي مع وضع ختم التنفيذ عليه.','ص99.');
T('e','إذا رُفض طلب تنفيذ الحكم الأجنبي، فلطالب التنفيذ رفع دعوى مبتدأة أمام القضاء السعودي متى ثبت لهذا القضاء معيار من معايير ثبوت الولاية وتخلفت معايير النفي.','ص100.');
F('e','الحكم الأجنبي لا يُنتج أي أثر خارج دائرة التنفيذ.','يتمتع الحكم الأجنبي خارج دائرة التنفيذ بحجية الأمر المقضي، فيُدفع بعدم جواز نظر الدعوى لسابقة الفصل فيها.','ص101.');
M('e','عند الدفع بعدم جواز نظر الدعوى لسابقة الفصل فيها بحكم أجنبي، يتعين على القضاء السعودي التأكد من:',['شروط الدفع، وتوافر أوصاف تنفيذ الحكم الأجنبي', 'صدور الحكم باللغة العربية، وتصديقه', 'موافقة الخصم الآخر على الدفع', 'مرور سنة على صدور الحكم الأجنبي'],'ص101.');

/* ===== قانون التنازع وقاعدة الإسناد ===== */
T('k','مبدأ سيادة الدولة يقتضي أن تطبق كل دولة أحكام قوانينها على الأشخاص الذين يحملون جنسيتها، سواء كانوا على إقليمها أو على أقاليم الدول الأخرى.','ص103.');
M('k','ما المقصود بقواعد الإسناد في القانون الدولي الخاص؟',['القواعد التي تحيل إلى القانون واجب التطبيق ولو كان قانون بلد آخر','القواعد التي تحدد العقوبات','القواعد التي تنظم القضاء المحلي','القواعد التي تنظم العلاقة بين المواطنين والأجانب'],'ص103، ص107: قاعدة الإسناد هي القاعدة من قانون بلد القاضي التي تشير إلى القانون واجب التطبيق على النزاع ذي الطابع الدولي.');X();
F('k','قاعدة الإسناد تشير إلى قانون أجنبي فيطبق القاضي أحكامه الموضوعية وقواعد التنازع فيه معاً.','تشير إلى الأحكام الموضوعية دون قواعد التنازع المقررة في القانون المشار إليه.','ص103، ص107.');
T('k','قاعدة الإسناد هي قاعدة من قانون بلد القاضي.','ص103، ص107.');
M('k','عدد شروط المنازعة ذات الطابع الدولي التي يظلها القانون الدولي الخاص بمظلته:',['ثلاثة','اثنان','أربعة','خمسة'],'ص105–106: الصفة الدولية، أكثر من قانون متصور تطبيقه، تبني قانون بلد القاضي لفكرة التنازع.');
F('k','دعوى تطليق مقامة من زوجة سعودية على زوج مصري أمام المحاكم المصرية ليست منازعة ذات طابع دولي.','هي منازعة ذات طابع دولي؛ فالعنصر الأجنبي هنا الجنسية الأجنبية لأحد أطراف النزاع.','ص105.');
T('k','من صور العنصر الأجنبي: تواجد المال في إقليم دولة أجنبية، كتعلق الدعوى بسيارة موجودة خارج دولة القاضي.','ص106.');
F('k','إذا كان قانون بلد القاضي لا يعترف إلا بإقليمية قانونه، فإنه يطبق القانون الأجنبي إذا كانت المنازعة دولية.','إذا كان قانونه لا يعترف إلا بإقليمية قانونه فلا مناص من تطبيق هذا القانون، فلا إعمال لفكرة التنازع.','ص106.');
T('k','إذا انتفى شرط من شروط المنازعة ذات الطابع الدولي الثلاثة، فلا إعمال لفكرة تنازع القوانين.','ص106.');
M('k','مركز الثقل في مسائل الأحوال الشخصية هو:',['الأطراف (فيطبق قانون الجنسية أو الموطن)','محل العلاقة (قانون موقع المال)','مكان نشأة الالتزام','مكان رفع الدعوى'],'ص106.');
M('k','مركز الثقل في مسائل الأموال هو محل العلاقة القانونية، لذلك يطبق:',['قانون موقع المال','قانون جنسية المالك','قانون موطن المالك','قانون القاضي'],'ص106.');
F('k','مركز الثقل في الالتزامات التعاقدية والتقصيرية هو جنسية الأطراف.','مركز الثقل فيها مكان نشأة الالتزام أو تنفيذه، فيطبق قانون بلد نشأة الالتزام أو تنفيذه.','ص106.');
M('k','هو أحد أفرع القانون الدولي الخاص الذي يقرر القانون واجب التطبيق، وفقاً لقواعد الإسناد الوطنية:',['تنازع القوانين','الجنسية','الموطن','القانون الدولي العام'],'ص107.');X();
T('k','تعريف قانون تنازع القوانين: الفرع من القانون الدولي الخاص الذي يقرر القانون واجب التطبيق، وفقاً لقواعد الإسناد الوطنية والمعاهدات الدولية التي تكون بلد القاضي طرفاً فيها، على المنازعات ذات الطابع الدولي التي يشملها القضاء الوطني باختصاصه.','ص107.');
F('k','تمتد مظلة تنازع القوانين لتشمل مسائل القانون العام.','تقتصر مظلة تنازع القوانين على مسائل القانون الخاص، كما هو الحال في تنازع الاختصاص القضائي الدولي.','ص107.');
M('k','أركان قاعدة الإسناد هي:',['الفكرة المسندة، وضابط الإسناد، والقانون المختص', 'الإيجاب، والقبول، والمحل، والسبب المشروع', 'الجنسية، والموطن، ومحل الإقامة المختار', 'الاختصاص، وتنفيذ الأحكام، وتنازع القوانين'],'ص107–108.');
M('k','موضوع النزاع المطروح أمام القاضي، والذي يجري عليه التكييف لإدراجه ضمن طائفة قانونية، هو:',['الفكرة المسندة','ضابط الإسناد','القانون الواجب التطبيق','قاعدة الإسناد'],'ص107.');
M('k','مركز الثقل في العلاقة القانونية ذات الطابع الدولي الذي يحدده قانون القاضي هو:',['ضابط الإسناد','الفكرة المسندة','الإحالة','التكييف'],'ص107–108.');
M('k','ضابط الإسناد في الالتزامات التعاقدية هو:',['عنصر السبب أو الإرادة','عنصر الجنسية','عنصر موقع المال','عنصر الفعل الضار'],'ص108: الجنسية للأحوال الشخصية، والموقع للأموال، والسبب أو الإرادة للتعاقدية، والسبب المنشئ للضرر للتقصيرية.');
T('k','القانون الذي تشير إليه قاعدة الإسناد قد يكون قانون بلد القاضي أو قانوناً أجنبياً.','ص108.');
M('k','وصف قاعدة الإسناد بأنها «لا تقدم الحل الموضوعي، وإنما ترشد إلى القانون واجب التطبيق» يعني أنها قاعدة:',['غير مباشرة','غير محددة المضمون','محايدة','مجردة'],'ص108.');
F('k','قاعدة الإسناد قاعدة محددة المضمون لأنها تتضمن الحل المادي للنزاع.','هي قاعدة غير محددة المضمون؛ فالذي يتضمن المضمون هو القانون الذي أشارت إليه.','ص108.');
M('k','وصف قاعدة الإسناد بأنها لا تنتصر لقانون على آخر، ولا لقانونها الوطني، وأنها «مغمضة العينين» يعني أنها:',['محايدة','مزدوجة','غير مباشرة','وطنية'],'ص109.');
T('k','قاعدة الإسناد قاعدة مجردة؛ تختار أنسب القوانين لحكم العلاقة في ضوء عناصر النزاع ذاته دون نظر لأي اعتبارات وطنية.','ص109.');
M('k','أي مما يلي ليس من خصائص قاعدة الإسناد؟',['أنها مباشرة', 'أنها مزدوجة', 'أنها محايدة', 'أنها مجردة'],'ص108–109: هي قاعدة غير مباشرة.');

/* ===== القانون واجب التطبيق في القانون المقارن ===== */
T('l','إذا كانت المنازعة محلية بحتة بعناصرها الثلاثة، فإن القاضي يطبق قانون بلده عليها.','ص111.');
M('l','بعد ثبوت الولاية للقضاء الوطني في المنازعة الدولية، يبحث القاضي في شروط قبول الدعوى، وأهمها:',['شرط الصفة','شرط الجنسية','شرط الإقامة','شرط المعاملة بالمثل'],'ص111، ص113.');
M('l','القانون الذي يحكم شروط قبول الدعوى (ومنها شرط الصفة) في الأنظمة المقارنة كالقانون المصري:',['قانون بلد القاضي','قانون جنسية المدعي','قانون موطن المدعى عليه','القانون الذي يحكم الموضوع'],'ص113.');
M('l','إسباغ الوصف القانوني على المنازعة المعروضة على القاضي ليتمكن من إدراجها ضمن مجموعتها القانونية هو:',['التكييف','الإحالة','الإسناد','الإثبات'],'ص114.');
T('l','القاعدة المسلم بها نظاماً وقضاءً وفقهاً أن قانون القاضي هو المرجع في التكييف.','ص114: نص القانون المصري: القانون المصري هو المرجع في تكييف العلاقات عندما يطلب تحديد نوعها في قضية تتنازع فيها القوانين.');
F('l','يأتي التكييف لاحقاً على معرفة القانون واجب التطبيق.','التكييف أمر سابق على معرفة القانون واجب التطبيق؛ فلا يمكن معرفة هذا القانون إلا بعد إسباغ الوصف القانوني على المنازعة.','ص114.');
M('l','إذا وصل القاضي في التكييف إلى أن المسألة من مسائل الأموال، فتحديد ما إذا كان المال منقولاً أو منقولاً بحسب المآل يرجع إلى:',['قانون موقع المال لأنه يحكم الموضوع', 'قانون القاضي لأنه يحكم التكييف الأولي', 'قانون جنسية المالك', 'قانون موطن المالك'],'ص114: هذا تكييف لاحق يسند للقانون الذي يحكم الموضوع، أما التكييف الأولي فلقانون القاضي.');
M('l','مركز الثقل بالنسبة للأشخاص في تحديد القانون واجب التطبيق على الأهلية:',['قانون جنسية الشخص','قانون موطن الشخص','قانون بلد إبرام التصرف','قانون القاضي'],'ص115.');
T('l','أهلية الوجوب تثبت للإنسان منذ ميلاده وحتى وفاته، أما أهلية الأداء فتتوافر لمن بلغ سن الرشد غير موصوف بمانع من موانع الأهلية أو عوارضها.','ص115.');
F('l','نص القانون المصري على خضوع الأهلية لقانون الجنسية يشمل أهلية الوجوب وأهلية الأداء معاً.','النص مخصوص بأهلية الأداء دون أهلية الوجوب (بحسب المذكرة الإيضاحية والشق الثاني من المادة).','ص115.');
M('l','النظام القانوني للأشخاص الاعتبارية الأجنبية من شركات وجمعيات يسري عليه:',['قانون دولة مركز إدارتها الرئيسي الفعلي', 'قانون دولة التأسيس في جميع الأحوال', 'قانون جنسية الشركاء أو المؤسسين', 'قانون القاضي في جميع الأحوال'],'ص115: ومع ذلك إذا باشرت نشاطها الرئيسي في بلد القاضي فقانونه هو الذي يسري.');
M('l','الشروط الموضوعية لصحة الزواج يُرجع فيها إلى:',['قانون كل من الزوجين','قانون الزوج وحده','قانون بلد إبرام الزواج','قانون القاضي'],'ص116: والوقت المعتد به هو وقت انعقاد الزواج.');
F('l','الوقت المعتد به في الشروط الموضوعية للزواج هو وقت رفع الدعوى.','الوقت المعتد به هو وقت انعقاد الزواج.','ص116.');
M('l','إذا كان قانون الزوجة يحدد سن الزواج لها بـ14 عاماً، وقانون الزوج يحدده بـ15 عاماً، فإن زواج من بلغت 14 عاماً يكون:',['صحيحاً وفق قانونها (تطبيق منفرد)', 'باطلاً تطبيقاً للقانون الأشد', 'صحيحاً تطبيقاً لقانون الزوج وحده', 'موقوفاً على إذن القاضي الوطني'],'ص116.');
T('l','في موانع الزواج التي لا يتصور أن تتخلف في شأن أحد الزوجين دون الآخر، كصلة القرابة، يطبق القانون الأشد حكماً (تطبيق جامع).','ص116: فإذا سمح قانون الزوج بالزواج من الخالة ومنعه قانون الزوجة، لا يسمح بالزواج.');
M('l','القانون الذي يحكم آثار الزواج، بما في ذلك الأثر المالي، في القانون المقارن:',['قانون جنسية الزوج وقت انعقاد الزواج', 'قانون جنسية الزوجة وقت انعقاد الزواج', 'قانون جنسية الزوج وقت رفع الدعوى', 'قانون الموطن المشترك للزوجين'],'ص117.');
M('l','يسري على الطلاق في القانون المقارن:',['قانون جنسية الزوج وقت الطلاق', 'قانون جنسية الزوج وقت الزواج', 'قانون جنسية الزوجة وقت الطلاق', 'قانون القاضي وقت رفع الدعوى'],'ص117: ويسري على التطليق والانفصال قانون الزوج وقت رفع الدعوى.');
F('l','يسري على التطليق والانفصال قانون الدولة التي ينتمي إليها الزوج وقت انعقاد الزواج.','يسري عليهما قانون الدولة التي ينتمي إليها الزوج وقت رفع الدعوى.','ص117.');
M('l','مركز الثقل بالنسبة لتحديد القانون واجب التطبيق على النفقة هو:',['قانون جنسية الشخص','قانون البلد الذي يقيم فيه','قانون البلد الذي ولد فيه','قانون البلد الذي رفعت فيه الدعوى'],'ص118: مركز الثقل جنسية المدين بها؛ فيسري على النفقة بين الأقارب قانون المدين بها.');X();
F('l','يسري على الالتزام بالنفقة فيما بين الأقارب قانون الدائن بالنفقة (طالبها).','يسري عليه قانون المدين بالنفقة (الملتزم بها).','ص118، ص138.');
M('l','مركز الثقل بالنسبة لتحديد القانون واجب التطبيق على المسائل الموضوعية الخاصة بالولاية والوصاية:',['قانون جنسية الشخص المطلوب حمايته','قانون بلد القاضي','قانون جنسية مقدم الطلب','القانون المحلي'],'ص119.');X();
M('l','مركز الثقل بالنسبة لتحديد القانون واجب التطبيق على المسائل الموضوعية الخاصة بالميراث والوصية:',['بلد جنسية المتوفى','بلد الوفاة','البلد الذي يقع فيه المال','بلد جنسية الوارث'],'ص120: قانون المورث أو الموصي وقت موته.');X();
M('l','يسري على شكل الوصية في القانون المقارن:',['قانون الموصي وقت الإيصاء أو قانون بلد الوصية', 'قانون الموصي وقت الموت دون أي قانون آخر', 'قانون الموصى له وقت الموت أو وقت القبول', 'قانون موقع المال الموصى به أو قانون القاضي'],'ص120.');
T('l','يسري على الحيازة والملكية والحقوق العينية الأخرى قانون الموقع فيما يختص بالعقار.','ص121.');
M('l','يسري على الحيازة والملكية والحقوق العينية في المنقول:',['قانون موقعه وقت تحقق السبب الذي ترتب عليه الكسب أو الفقد', 'قانون جنسية مالكه وقت تحقق سبب الكسب أو الفقد', 'قانون موطن مالكه وقت تحقق سبب الكسب أو الفقد', 'قانون موقعه وقت رفع الدعوى أمام القاضي'],'ص121.');
M('l','في القانون المقارن، يسري على الالتزامات التعاقدية:',['قانون الموطن المشترك، وإلا قانون بلد الإبرام، ما لم يُتفق على غيره', 'قانون جنسية المدين، وإلا قانون موطنه، ما لم يُتفق على غيره', 'قانون القاضي، وإلا قانون بلد التنفيذ، ما لم يُتفق على غيره', 'قانون مكان التنفيذ، وإلا قانون الجنسية المشتركة للمتعاقدين'],'ص122.');
F('l','العقود التي أُبرمت في شأن عقار يسري عليها قانون الموطن المشترك للمتعاقدين.','يسري عليها قانون موقع العقار.','ص122.');
T('l','العقود ما بين الأحياء تخضع في شكلها لقانون البلد الذي تمت فيه، ويجوز أن تخضع للقانون الذي يحكم الموضوع أو لقانون موطن المتعاقدين أو قانونهما الوطني المشترك.','ص122.');
M('l','يسري على الالتزامات غير التعاقدية:',['قانون البلد الذي وقع فيه الفعل المنشئ', 'قانون جنسية المضرور وقت وقوع الفعل', 'قانون موطن المسؤول وقت وقوع الفعل', 'قانون القاضي في جميع الأحوال'],'ص123.');
T('l','في القانون المصري، لا يسري قانون بلد وقوع الفعل الضار على الوقائع التي تحدث في الخارج وتكون مشروعة في مصر وإن كانت غير مشروعة في البلد الذي وقعت فيه.','ص123.');
F('l','إذا تعارض نص خاص مع معاهدة دولية نافذة في بلد القاضي، يقدم النص الخاص.','المعاهدة تأتي في مرتبة سابقة في التطبيق على النص الخاص.','ص124.');
M('l','فيما لم يرد بشأنه نص في قواعد الإسناد أو قانون خاص أو معاهدة، يُتبع:',['مبادئ القانون الدولي الخاص','قانون القاضي دائماً','العرف المحلي','قانون جنسية المدعي'],'ص124.');
T('l','بالنسبة لعديمي الجنسية ومتعددي الجنسيات، يقوم القاضي الوطني بتعيين القانون الذي يجب تطبيقه.','ص124.');
M('l','إذا كان القانون واجب التطبيق قانون دولة تتعدد فيها القوانين الداخلية، فإن الذي يقرر أي قانون منها يجب تطبيقه:',['القانون الداخلي لتلك الدولة', 'قانون القاضي الوطني', 'اتفاق أطراف النزاع', 'قانون موطن المدعى عليه'],'ص124.');
F('l','إذا تقرر أن قانوناً أجنبياً هو الواجب التطبيق، فيطبق منه أحكامه الداخلية وقواعده في القانون الدولي الخاص.','لا يطبق منه إلا أحكامه الداخلية، دون التي تتعلق بالقانون الدولي الخاص.','ص124.');
M('l','لا يوجد تلازم حتمي بين الاختصاص القضائي والقانون واجب التطبيق الا في حالة :',['اذا كان موضوع النزاع عقارا','كان القاضي و الخصوم يحملون ذات الجنسية','اذا كان احد الخصوم يحمل اكثر من جنسيه وكانت جنسيه القاضي هي الجنسيه الفاعله','اذا كان موضوع النزاع متعلق النفقة'],'العقار: الدعوى العينية العقارية تختص بها محكمة موقع العقار (ص37، ص49، ص71)، والقانون الواجب التطبيق هو قانون موقع العقار (ص121، ص138). فيتلازمان.');X();
M('j','أي مما يلي لا يعتبر من القواعد العامة في الاختصاص القضائي الدولي ؟',['اختصاص محكمة جنسيه الام في رعاية الاطفال','اختصاص محكمة بلد المدعى عليه','اختصاص محكمة موقع العقار','اختصاص محكمه الموضوع لاتخاذ الاجراءات التحفظية'],'القاعدة الأصلية: بلد المدعى عليه (جنسيته أو إقامته) ص35 وص40؛ العقار لمحكمة موقعه ص37 وص71؛ التدابير التحفظية تتخذها المحكمة المختصة بالموضوع ص67. أما جنسية الأم فليست قاعدة.');X();

/* ===== النظام العام والإحالة والغش وإثبات القانون الأجنبي ===== */
T('o','تأخذ الدول بمبدأ عدم جواز تطبيق أحكام قانون أجنبي عينته قواعد الإسناد إذا كانت مخالفة للنظام العام أو الآداب في البلد الوطني.','ص124–125.');
M('o','كافة القواعد الآمرة المقررة في قانون بلد القاضي التي لا يجوز الاتفاق على مخالفتها، ويقع الاتفاق على مخالفتها باطلاً، هي:',['النظام العام الداخلي','النظام العام الدولي','قواعد الإسناد','قواعد الاختصاص'],'ص125.');
T('o','قواعد النظام العام الدولي تكتسب مفهوماً أضيق من النظام العام الداخلي، فتقتصر على القواعد والأحكام الرئيسية الأساسية في مجتمع بلد القاضي.','ص125.');
M('o','من أمثلة ما يخالف النظام العام بمفهومه في القانون الدولي الخاص في الدول التي تدين بالشريعة الإسلامية:',['زواج المسلمة من المسيحي','زواج المسلم من الكتابية','تعدد الزوجات','الطلاق'],'ص125.');
F('o','الذي يعطل قاعدة الإسناد أن يكون القانون الأجنبي مخالفاً للنظام العام بمفهومه الداخلي.','الذي يعطلها أن يكون مخالفاً للنظام العام بمفهومه في القانون الدولي الخاص، وليس بمفهومه الداخلي.','ص125.');
T('o','الدفع بالنظام العام يُعمله القاضي الوطني من تلقاء نفسه ولو لم يطلبه الخصوم.','ص125.');
F('o','إذا أشارت قاعدة الإسناد إلى تطبيق قانون بلد القاضي، فيجوز للقاضي إعمال الدفع بالنظام العام.','لا مجال للدفع بالنظام العام هنا؛ إذ لا يتصور أن يكون قانونه الوطني مخالفاً لذلك، ولو فرض ذلك فطريقه الدفع بعدم الدستورية.','ص126.');
M('o','الأثر السلبي لإعمال الدفع بالنظام العام هو:',['استبعاد القانون الأجنبي المخالف', 'تطبيق قانون القاضي على النزاع', 'الحكم بعدم الاختصاص بالدعوى', 'رفض الدعوى لعدم وجود قانون'],'ص126: كصمام أمان يمنع دخول أحكام أجنبية تتعارض مع القواعد الأساسية.');
T('o','يرى المؤلفان أن من الأثر الإيجابي للدفع بالنظام العام استبعاد الشق المخالف فقط من القانون الأجنبي، إلا إذا كان الباقي لا يمكن تطبيقه بدونه.','ص126.');
T('o','يرى المؤلفان أن من الأثر الإيجابي للدفع بالنظام العام قيام القاضي الوطني بتطبيق أحكام قانونه على النزاع، وإلا كنا بصدد فراغ قانوني.','ص126.');
F('o','إذا مثل المدعى عليه أمام القاضي بعد استبعاد القانون الأجنبي بالدفع بالنظام العام، فلا يُعد ذلك رضاءً منه بتطبيق قانون بلد القاضي.','يُعد قبوله المثول أمام القاضي رضاءً منه بتطبيق أحكام قانون بلد القاضي على النزاع.','ص127.');
M('o','زوجة مسلمة تزوجت مسيحياً في بلد يقر هذا الزواج، ثم أقامت دعوى نفقة زوجية عليه في بلد يدين بالشريعة الإسلامية. الحكم:',['لا يُعترف بالزواج، ويستبعد القانون برمته، فلا نفقة لها', 'يُعمل الأثر المخفف للدفع، فتستحق نفقة الزوجية', 'تستحق النفقة لأن الزواج نشأ في بلد يقر هذا الزواج', 'يطبق قانون جنسية الزوج، فتستحق النفقة وفقاً له'],'ص127: المجتمع لا يتقبل إطلاقاً هذه الآثار، فلا يُعمل الأثر المخفف.');
T('o','فرنسا لا تقر تعدد الزوجات، لكنها تقر الآثار المترتبة على زواج ثانٍ لمسلم عقده في بلد يدين بالشريعة الإسلامية، وهذا تطبيق للأثر المخفف للدفع بالنظام العام.','ص127.');
F('o','يُعمل الأثر المخفف للدفع بالنظام العام إذا كان المجتمع لا يتقبل إطلاقاً الآثار التي يراد الاحتجاج بها في بلد القاضي.','يُعمل الأثر المخفف إذا كان المجتمع لا يتقبل نشأة المركز عنده لكنه يتقبل آثاره القانونية الناشئة في دولة تسمح به.','ص127.');
T('o','إذا أشارت قاعدة الإسناد إلى قانون بلد القاضي، فيطبق القاضي أحكامه الموضوعية دون قواعد التنازع فيه، وإلا دار في دائرة مغلقة.','ص129.');
M('o','عندما تشير قاعدة الإسناد إلى قانون أجنبي، تحيل قواعد التنازع فيه إلى قانون آخر، وقد تحيل قواعده إلى قانون ثالث. هذه هي فكرة:',['الإحالة','التكييف','الغش نحو القانون','النظام العام'],'ص129.');
M('o','موقف المؤلفين والقانون المصري من الإحالة:',['تطبيق الأحكام الموضوعية للقانون الأجنبي دون قواعد التنازع فيه', 'الأخذ بالإحالة من الدرجة الأولى إلى قانون القاضي فقط', 'الأخذ بالإحالة من الدرجتين إلى قانون القاضي أو قانون ثالث', 'تطبيق قانون القاضي في جميع الأحوال دون القانون الأجنبي'],'ص129.');
F('o','أخذ القانون المصري بالإحالة، فيطبق القاضي قواعد التنازع في القانون الأجنبي.','عندما تشير قاعدة الإسناد لقانون أجنبي يطبق القاضي منه أحكامه الموضوعية دون قواعد التنازع فيه.','ص129.');
M('o','تغيير الشخص لضابط الإسناد، لا عن رغبة حقيقية، بل وصولاً إلى تطبيق قانون يجيز العلاقة، يسمى:',['الغش نحو القانون','الإحالة','النظام العام','التكييف'],'ص131.');
T('o','الغش نحو القانون ينطوي على الافتئات على مبدأ المساواة.','ص131: فقاعدة الإسناد وضعت لتطبق على الجميع، والغش يصطنع معياراً يؤدي لتطبيق القانون الذي يريده الغاش.');
M('o','يشترط للقول بوجود غش نحو القانون:',['تغيير ضابط الإسناد بأسلوب مشروع، وقصد الهروب من القانون المختص', 'تغيير ضابط الإسناد بأسلوب غير مشروع، وتحقق ضرر للطرف الآخر', 'تغيير ضابط الإسناد بأي أسلوب، وصدور حكم قضائي في النزاع', 'بقاء ضابط الإسناد كما هو، وقصد تطبيق قانون القاضي'],'ص132.');
F('o','يتحقق الغش نحو القانون ولو كان تغيير ضابط الإسناد بأسلوب غير مشروع.','يشترط أن يكون التغيير بأسلوب مشروع؛ فلو كان غير مشروع ما أنتج أثره أصلاً.','ص132.');
M('o','من القرائن التي يستدل بها القضاء على قصد الغش نحو القانون:',['التلازم الزمني بين تغيير الضابط والوصول للمركز الجديد', 'اختلاف جنسية القاضي عن جنسية أطراف النزاع', 'طول مدة إقامة الشخص في الدولة الجديدة', 'وجود عقد مكتوب بين أطراف العلاقة'],'ص132.');
M('o','في قضية «دي بوفرمون»، رفضت محكمة النقض الفرنسية تطبيق القانون الأجنبي الجديد لأن:',['أن الهدف من التجنس كان التطليق والزواج من جديد', 'أن الجنسية الجديدة اكتُسبت بطريق التزوير', 'أن الزواج الجديد أُبرم داخل الأراضي الفرنسية', 'أن الزوجة لم تكن مقيمة في فرنسا وقت الدعوى'],'ص132: تزوجت بالفعل من الأمير بيبسكو بعد التجنس بشهور قلائل.');
F('o','في الدول التي تدين بالشريعة الإسلامية، اعتناق الإسلام وصولاً إلى تغيير ضابط الإسناد يُشكل غشاً نحو القانون.','لا يشكل بأي حال من الأحوال غشاً نحو القانون، والارتداد عن الإسلام غير مقبول.','ص132.');
T('o','إذا أشارت قاعدة الإسناد إلى تطبيق القانون الوطني، فلا مجال للحديث عن عبء إثبات هذا القانون.','ص133: القاضي مطالب بتطبيق قانونه ويفترض أنه يعلمه.');
M('o','إذا أشارت قاعدة الإسناد إلى تطبيق قانون أجنبي، فالأصل:',['يلتزم القاضي بتطبيقه من تلقاء نفسه ويستعين بالخصوم', 'يلتزم الخصوم وحدهم بإثباته وإلا رُفضت الدعوى', 'يطبق القاضي قانونه بدلاً من القانون الأجنبي', 'يحكم القاضي بعدم الاختصاص بنظر الدعوى'],'ص133.');
M('o','طرق إثبات القانون الأجنبي يُرجع فيها إلى:',['قانون بلد القاضي','القانون الأجنبي نفسه','اتفاق الخصوم','وثيقة الكويت'],'ص133.');
F('o','قضت محكمة النقض الفرنسية مؤخراً بأن القاضي وحده يقع عليه عبء إثبات محتوى القانون الأجنبي.','قضت بأنه يقع على عاتق الشخص الذي يدعي أن عقداً يخضع لقانون أجنبي إقامة الدليل على محتوى هذا القانون.','ص133.');

/* ===== تنازع القوانين أمام القضاء السعودي ===== */
M('s','ترتيب خطوات القاضي الوطني في المنازعة ذات الطابع الدولي:',['معيار النفي، ثم معيار الثبوت، ثم قواعد التنازع', 'قواعد التنازع، ثم معيار الثبوت، ثم معيار النفي', 'معيار الثبوت، ثم معيار النفي، ثم تنفيذ الحكم', 'قواعد التنازع، ثم معيار النفي، ثم معيار الثبوت'],'ص135.');
F('s','حدد المنظم السعودي نظاماً حالات تطبيق القانون الأجنبي على النزاع ذي الطابع الدولي.','لم يحدد المنظم السعودي ذلك، اكتفاءً بتقرير قواعد ومعايير ثبوت الولاية للقضاء السعودي.','ص135.');
T('s','وفقاً للمادة السابعة من النظام الأساسي للحكم، يستمد الحكم في المملكة سلطته من كتاب الله تعالى وسنة رسوله، وهما الحاكمان على هذا النظام وجميع أنظمة الدولة.','ص135.');
T('s','إذا وجدت اتفاقية دولية انضمت إليها المملكة، فإن القاضي السعودي يطبق أحكامها بشأن تنازع القوانين، بشرط ألا تخالف النظام العام وأحكام الشريعة وألا يكون هناك غش نحو الأنظمة.','ص136.');
F('s','يتفق المؤلفان مع جل الفقه في أن القاضي السعودي يطبق الأنظمة السعودية دائماً على النزاع ذي الطابع الدولي الذي انعقد له الاختصاص بنظره.','يخالفان جل الفقه، ويقرران أن النظام السعودي يعرف فكرة تنازع القوانين ويتعين على القضاء تطبيقها.','ص136.');
M('s','استند المؤلفان في القول بأن النظام السعودي يعرف فكرة تنازع القوانين إلى:',['وثيقة الكويت للنظام المدني الموحد', 'نظام المرافعات الشرعية ولائحته', 'نظام التنفيذ ولائحته التنفيذية', 'اتفاقية الرياض العربية للتعاون القضائي'],'ص136–137.');
M('s','وثيقة الكويت للنظام المدني الموحد لدول مجلس التعاون أقرها وزراء العدل في اجتماعهم التاسع الذي عقد في:',['الدوحة','الكويت','الرياض','مسقط'],'ص137: ووافق عليها المجلس الأعلى في دورته الثامنة عشرة التي عقدت في الكويت.');
T('s','من القواعد الكلية الفقهية في وثيقة الكويت: العبرة في العقود للمقاصد والمعاني لا للألفاظ والمباني.','ص137.');
M('s','وفقاً لوثيقة الكويت، المرجع في تكييف العلاقات عندما تتنازعها القوانين لمعرفة القانون الواجب التطبيق:',['القانون الوطني','القانون الأجنبي','قانون الموطن','قانون الجنسية'],'ص137.');
F('s','وفقاً لوثيقة الكويت، إذا كان الأجنبي ناقص الأهلية في تصرف مالي عُقد في الدولة، يؤثر ذلك في تصرفه في جميع الأحوال.','إذا كان نقص الأهلية لسبب فيه خفاء لا يسهل على الطرف الآخر تبينه، فإن هذا السبب لا يؤثر في تصرفه.','ص137.');
T('s','وفقاً لوثيقة الكويت، يعتبر الزواج بين أجنبيين أو بين أجنبي ووطني صحيحاً من حيث الشكل إذا عُقد وفقاً لقانون بلد الإبرام أو قانون الزوج.','ص137.');
M('s','وفقاً لوثيقة الكويت، إذا اتحدت جنسية الزوجين بعد الزواج، فإنه يطبق على آثار الزواج:',['قانون جنسيتهما','قانون الزوج وقت الزواج','قانون الزوجة','قانون بلد الإبرام'],'ص138: والأصل قانون الدولة التي ينتمي إليها الزوج وقت الزواج.');
T('s','وفقاً لوثيقة الكويت، يسري على الطلاق قانون الدولة التي ينتمي إليها الزوج وقت الطلاق، وعلى التطليق القضائي والفسخ والانفصال قانون الزوج وقت رفع الدعوى.','ص138.');
M('s','وفقاً لوثيقة الكويت، يسري على الالتزام بالنفقة فيما بين الأقارب:',['قانون دولة الملتزم بها','قانون دولة طالب النفقة','قانون بلد الإقامة','قانون القاضي'],'ص138.');
T('s','وفقاً لوثيقة الكويت، يسري على الميراث قانون الدولة التي ينتمي إليها المورث وقت موته.','ص138.');
F('s','وفقاً لوثيقة الكويت، تؤول الحقوق المالية للأجنبي الذي لا وارث له إلى دولته إذا صرح قانونها بذلك.','تؤول إلى الدولة التي توجد على إقليمها، ولو صرح قانون دولته بخلاف ذلك.','ص138.');
F('s','وفقاً لوثيقة الكويت، يرث الأجنبي غير المسلم من الوطني ولو كان قانون دولة الأجنبي لا يورث الوطني.','بالنسبة لغير المسلمين، لا يرث الأجنبي من الوطني إذا كان قانون دولة الأجنبي لا يورث الوطني.','ص138.');
M('s','وفقاً لوثيقة الكويت، يسري على الالتزامات التعاقدية شكلاً وموضوعاً:',['القانون المتفق عليه صراحة أو ضمناً، وإلا قانون بلد الإبرام', 'قانون الموطن المشترك، وإلا قانون بلد الإبرام', 'قانون جنسية المدين، وإلا قانون بلد التنفيذ', 'قانون مكان التنفيذ، وإلا قانون القاضي'],'ص138.');
T('s','وفقاً لوثيقة الكويت، القانون الذي يحدد ما إذا كان الشيء عقاراً أو منقولاً هو قانون الدولة التي يوجد فيها هذا الشيء.','ص138.');
M('s','وفقاً لوثيقة الكويت، يسري على العقار:',['قانون بلد موقعه','قانون جنسية المالك','قانون موطن المالك','قانون القاضي'],'ص138.');
T('s','وفقاً لوثيقة الكويت، يسري على الالتزامات غير التعاقدية قانون الدولة التي حدثت فيها الواقعة المنشئة للالتزام.','ص139: ولا يسري ذلك على الفعل الضار الذي يقع في الخارج غير مشروع هناك إذا كان مشروعاً في القانون الوطني.');
M('s','وفقاً لوثيقة الكويت، يسري على قواعد الاختصاص وإجراءات التقاضي:',['قانون دولة إقامة الدعوى أو مباشرة الإجراءات', 'قانون جنسية المدعى عليه وقت رفع الدعوى', 'قانون موطن المدعي وقت رفع الدعوى', 'القانون الذي يحكم العقد محل النزاع'],'ص139.');
M('s','وفقاً لوثيقة الكويت، يطبق قانون بلد القاضي على:',['متعدد الجنسيات أحدها وطنية، وعديم الجنسية', 'متعدد الجنسيات الأجنبية فقط دون غيره', 'جميع الأجانب المقيمين في دولة القاضي', 'الوطنيين المقيمين خارج دولة القاضي فقط'],'ص139: أما متعددو الجنسيات الأجنبية فتعين المحكمة القانون الواجب التطبيق عليهم.');
F('s','وفقاً لوثيقة الكويت، إذا كان القانون الواجب التطبيق قانون دولة تتعدد فيها القوانين الداخلية ولم يوجد نص يحدد أيها يطبق، فيطبق قانون القاضي.','قانون تلك الدولة هو الذي يحدد، فإذا لم يوجد نص طبقت أحكام القانون الغالب.','ص139.');
T('s','وفقاً لوثيقة الكويت، لا يجوز تطبيق أحكام تشير إليها قواعد الإسناد إذا كانت تخالف الشريعة الإسلامية أو النظام العام.','ص139.');
T('s','يرى المؤلفان أن القواعد التي تضمنتها وثيقة الكويت لا تختلف كثيراً عن القواعد التي قررها القانون المقارن.','ص139.');

// ===== التطبيق =====
const KEY='dawli-quiz-v1';
let st={a:{}};
try{const r=localStorage.getItem(KEY);if(r)st=JSON.parse(r)||{a:{}};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
Q.forEach((q,i)=>q.id=i);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const wrongIds=()=>Q.filter(q=>st.a[q.id]===0).map(q=>q.id);

function home(){
  const done=Object.keys(st.a).length, right=Object.values(st.a).filter(v=>v===1).length, wr=wrongIds().length;
  let h=`<header><h1>بنك أسئلة القانون الدولي الخاص</h1><p class="sub">تحديد الميد: من أول الكتاب إلى ص139 (الفصل التمهيدي والجزء الأول) · ${ar(Q.length)} سؤالاً صح وخطأ واختيار من متعدد</p></header>
  <div class="stats"><div class="stat"><b>${ar(done)}</b><span>جاوبت</span></div><div class="stat"><b>${ar(right)}</b><span>صح</span></div><div class="stat"><b>${ar(wr)}</b><span>أخطاؤك الحالية</span></div></div>
  <div class="actions">
    <button class="btn" data-go="all">ابدأ كل الأسئلة بالترتيب</button>
    <button class="btn alt" data-go="past">★ أسئلة التجميعات (${ar(Q.filter(q=>q.x).length)})</button>
    <button class="btn warn" data-go="wrong" ${wr?'':'disabled'}>راجع أخطاءك (${ar(wr)})</button>
  </div>
  <p class="note">الأسئلة بنفس ترتيب الكتاب داخل كل قسم، واللي عليها «★ من التجميعات» من التجميعات والاختبارات السابقة بصياغتها (وأجوبتها متأكد منها من الكتاب). أسئلة الجنسية والموطن ومركز الأجانب برا التحديد وما انحطت. إذا غلطت في سؤال ينحفظ في «راجع أخطاءك»، ويطلع منها إذا جاوبته صح.</p>
  <h2>الأقسام</h2><div class="secs">`;
  S.forEach(s=>{
    const qs=Q.filter(q=>q.s===s.k), d=qs.filter(q=>q.id in st.a).length;
    h+=`<button class="sec" data-go="s:${s.k}"><span class="t">${s.name}${s.mid?'':'<span class="tag">بعد الميد</span>'}</span><span class="n">${ar(d)}/${ar(qs.length)}</span><span class="p">${s.pages}</span><span class="bar"><i style="width:${qs.length?d/qs.length*100:0}%"></i></span></button>`;
  });
  h+=`</div><div class="actions" style="margin-top:20px"><button class="btn alt" data-go="reset">ابدأ من جديد (امسح التقدّم)</button></div>`;
  app.innerHTML=h;
}

let run=null;
function start(ids,title){run={ids,i:0,title,score:0,answered:false};show();}
function show(){
  if(run.i>=run.ids.length)return finish();
  const q=Q[run.ids[run.i]];run.answered=false;
  const sec=S.find(s=>s.k===q.s);
  let opts;
  if(q.t==='tf')opts=`<div class="opts tf"><button class="opt" data-v="1">صح</button><button class="opt" data-v="0">خطأ</button></div>`;
  else{run.order=shuffle(q.o.map((t,i)=>({t,i})));opts=`<div class="opts">${run.order.map(o=>`<button class="opt" data-v="${o.i}">${esc(o.t)}</button>`).join('')}</div>`;}
  app.innerHTML=`<div class="top"><button class="back" data-go="home">→ الأقسام</button><span class="count">${ar(run.i+1)} / ${ar(run.ids.length)}</span></div>
  <div class="prog"><i style="width:${run.i/run.ids.length*100}%"></i></div>
  <div class="card"><div class="kind"><span>${sec.name} · ${q.t==='tf'?'صح أو خطأ':'اختيار من متعدد'}</span>${q.x?'<span class="past">★ من التجميعات</span>':''}</div><p class="q">${esc(q.q)}</p>${opts}<div id="fb"></div></div>`;
}
function answer(v){
  if(run.answered)return;run.answered=true;
  const q=Q[run.ids[run.i]];
  let ok;
  const btns=[...app.querySelectorAll('.opt')];
  if(q.t==='tf'){ok=(v==='1')===q.a;btns.forEach(b=>{if((b.dataset.v==='1')===q.a)b.classList.add('right');else if(b.dataset.v===v)b.classList.add('wrong');b.disabled=true;});}
  else{ok=v==='0';btns.forEach(b=>{if(b.dataset.v==='0')b.classList.add('right');else if(b.dataset.v===v)b.classList.add('wrong');b.disabled=true;});}
  st.a[q.id]=ok?1:0;save();if(ok)run.score++;
  let fb=`<div class="fb ${ok?'ok':'no'}"><span class="h">${ok?'إجابة صحيحة':'إجابة خاطئة'}</span>`;
  if(q.t==='tf')fb+=`الجواب: <b>${q.a?'صح':'خطأ'}</b>`;
  else fb+=`الجواب: <b>${esc(q.o[0])}</b>`;
  if(q.c)fb+=`<span class="c">التصحيح: <b>${esc(q.c)}</b></span>`;
  fb+=`<span class="c" style="font-weight:400">${esc(q.e)}</span></div>
  <div class="nav"><button class="btn" data-go="next">${run.i+1<run.ids.length?'التالي ←':'النتيجة'}</button></div>`;
  document.getElementById('fb').innerHTML=fb;
  app.querySelector('[data-go="next"]').focus();
}
function finish(){
  const n=run.ids.length,p=Math.round(run.score/n*100),wr=wrongIds().length;
  app.innerHTML=`<div class="top"><button class="back" data-go="home">→ الأقسام</button></div>
  <div class="card end"><div class="big">${ar(run.score)} / ${ar(n)}</div><p>${run.title} · ${ar(p)}٪</p>
  <div class="actions"><button class="btn warn" data-go="wrong" ${wr?'':'disabled'}>راجع أخطاءك (${ar(wr)})</button><button class="btn alt" data-go="home">ارجع للأقسام</button></div></div>`;
}
let resetArmed=false;
app.addEventListener('click',e=>{
  const o=e.target.closest('.opt');if(o&&run&&!run.answered){answer(o.dataset.v);return;}
  const b=e.target.closest('[data-go]');if(!b||b.disabled)return;
  const g=b.dataset.go;
  if(g==='home'){run=null;home();window.scrollTo(0,0);}
  else if(g==='next'){run.i++;show();window.scrollTo(0,0);}
  else if(g==='mid')start(Q.filter(q=>S.find(s=>s.k===q.s).mid).map(q=>q.id),'أسئلة الميد');
  else if(g==='all')start(Q.map(q=>q.id),'كل الأسئلة');
  else if(g==='wrong')start(shuffle(wrongIds()),'راجع أخطاءك');
  else if(g==='past')start(Q.filter(q=>q.x).map(q=>q.id),'أسئلة التجميعات');
  else if(g.startsWith('s:')){const k=g.slice(2);start(Q.filter(q=>q.s===k).map(q=>q.id),S.find(s=>s.k===k).name);}
  else if(g==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='اضغط مرة ثانية للتأكيد';setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent='ابدأ من جديد (امسح التقدّم)';},4000);return;}
    st={a:{}};save();resetArmed=false;home();
  }
  if(g!=='next')window.scrollTo(0,0);
});
home();
</script>
